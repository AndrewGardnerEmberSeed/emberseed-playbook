<script>
(() => {
  'use strict';
  const DATA = JSON.parse(document.getElementById('playbook-data').textContent);
  const STAGES = DATA.stages, BRANCHES = DATA.branches, NODES = DATA.nodes;
  const byId = Object.fromEntries(NODES.map((n) => [n.id, n]));
  const stageOf = Object.fromEntries(STAGES.map((s) => [s.id, s]));
  const branchOf = Object.fromEntries(BRANCHES.map((b) => [b.id, b]));
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const shared = (n) => !!stageOf[n.stage].layout;   // the first wins and the foundations belong to everyone

  // ---- the viewer's own plan, kept in this browser only ----
  const KEY = 'emberseed-playbook-plan';
  let plan = {};
  try { plan = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch { plan = {}; }
  const savePlan = () => { try { localStorage.setItem(KEY, JSON.stringify(plan)); } catch { /* private window: the plan lasts this visit */ } };

  // ---- words ----
  const T = DATA.text;
  $('kicker').textContent = T.kicker;
  $('headline').textContent = T.headline;
  $('lede').textContent = T.lede;
  if (T.context) {
    const refs = (T.contextSources || []).map((s, i) => `<a href="${esc(s.u)}" target="_blank" rel="noopener" title="${esc(s.t)}">[${i + 1}]</a>`).join(' ');
    $('context').innerHTML = `${esc(T.context)} ${refs}`;
  }
  $('howto').innerHTML = T.howto.map((h, i) => `<li><span class="n">${i + 1}</span><div><b>${esc(h.title)}</b><span>${esc(h.text)}</span></div></li>`).join('');
  $('mapnote').textContent = T.mapnote;

  // ---- order: the stages top to bottom, each stage's nodes in the branches' order ----
  const order = [];
  STAGES.forEach((s) => BRANCHES.forEach((b) => NODES.filter((n) => n.stage === s.id && n.branch === b.id).forEach((n) => order.push(n.id))));

  // ---- deterministic jitter, so the roots look grown but never move between visits ----
  function rng(seed) {
    let h = 2166136261;
    for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
    return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function wrap(text, max) {
    const words = String(text).split(/\s+/), lines = [];
    let line = '';
    for (const w of words) {
      if (line && (line + ' ' + w).length > max) { lines.push(line); line = w; } else line = line ? line + ' ' + w : w;
    }
    if (line) lines.push(line);
    return lines;
  }

  // ---- the drawing ----
  const NS = 'http://www.w3.org/2000/svg';
  const svg = $('map');
  const mk = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const lines = (t, x, list, gap) => list.forEach((ln, i) => { mk('tspan', { x, dy: i ? gap : 0 }, t).textContent = ln; });

  const W = 1360, GUTTER = 156, RIGHT = 24, GROUND = 92;
  const cols = BRANCHES.length;
  const colW = (W - GUTTER - RIGHT) / cols;
  const colX = (i) => GUTTER + (i + 0.5) * colW;
  const coreIndex = BRANCHES.findIndex((b) => b.id === 'core');
  const CX = colX(coreIndex);
  const SLOT = 88, LABEL_CHARS = Math.floor((colW - 12) / 7);
  const HEAD = 62;   // room at the top of the first team layer for the names of the parts of the business

  // how tall each layer is: room for its busiest column
  const teamStages = STAGES.filter((s) => !s.layout);
  const bands = [];
  let y = GROUND;
  STAGES.forEach((s) => {
    let h;
    if (s.layout === 'spread') h = 128;
    else if (s.layout === 'row') h = 196;
    else {
      const most = Math.max(1, ...BRANCHES.map((b) => NODES.filter((n) => n.stage === s.id && n.branch === b.id).length));
      h = (s === teamStages[0] ? HEAD : 0) + 34 + (most - 1) * SLOT + 70;
    }
    bands.push({ s, top: y, h });
    y += h;
  });
  const H = y + 20;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const defs = mk('defs', {}, svg);
  defs.innerHTML = `
    <linearGradient id="g-root" gradientUnits="userSpaceOnUse" x1="0" y1="${GROUND}" x2="0" y2="${H}"><stop offset="0" stop-color="#EBA94A"/><stop offset="0.45" stop-color="#D9762C"/><stop offset="1" stop-color="#B4441A"/></linearGradient>
    <radialGradient id="g-ember" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F3B861" stop-opacity="0.45"/><stop offset="1" stop-color="#F3B861" stop-opacity="0"/></radialGradient>`;

  // the ground line and the faint soil layers
  mk('rect', { x: 0, y: 0, width: W, height: H, fill: 'var(--map-bg)' }, svg);
  bands.forEach((b, i) => {
    if (i % 2) mk('rect', { x: 0, y: b.top, width: W, height: b.h, fill: 'var(--map-band)' }, svg);
    mk('line', { x1: 0, y1: b.top, x2: W, y2: b.top, stroke: 'var(--map-line)', 'stroke-width': 1 }, svg);
  });
  mk('line', { x1: 24, y1: GROUND, x2: W - 24, y2: GROUND, stroke: '#E39B3F', 'stroke-opacity': 0.55, 'stroke-width': 1.5 }, svg);

  // each layer's name, and how long businesses usually take to reach it
  bands.forEach((b) => {
    const nameLines = wrap(b.s.name, 14);
    const t = mk('text', { x: 28, y: b.top + 32, class: 'stage-name' }, svg);
    lines(t, 28, nameLines, 19);
    mk('text', { x: 28, y: b.top + 32 + nameLines.length * 19, class: 'stage-when' }, svg).textContent = b.s.when;
  });

  const roots = mk('g', { 'aria-hidden': 'true' }, svg);
  const heads = mk('g', {}, svg);
  const nodesG = mk('g', {}, svg);
  const rootEls = [];   // { el, branch, upTo } so a chosen node can light its own route
  function root(d, width, branch, upTo) {
    const p = mk('path', { d, class: 'root', stroke: 'url(#g-root)', 'stroke-width': width }, roots);
    rootEls.push({ el: p, branch, upTo });
    return p;
  }

  // positions
  const pos = {};
  const seedBand = bands.find((b) => b.s.layout === 'spread');
  const rowBand = bands.find((b) => b.s.layout === 'row');
  const firstTeam = bands.find((b) => !b.s.layout);
  const ROW_Y = rowBand ? rowBand.top + 44 : GROUND + 180;
  const ROW_X0 = colX(0) + colW * 0.5, ROW_X1 = colX(cols - 1) - colW * 0.5;
  bands.forEach((b) => {
    const s = b.s;
    if (s.layout === 'spread') {
      const here = NODES.filter((n) => n.stage === s.id);
      const span = 360;
      here.forEach((n, i) => { pos[n.id] = { x: CX + (i - (here.length - 1) / 2) * span, y: b.top + 50, big: true }; });
    } else if (s.layout === 'row') {
      const here = NODES.filter((n) => n.stage === s.id);
      here.forEach((n, i) => {
        const x = here.length > 1 ? ROW_X0 + (i * (ROW_X1 - ROW_X0)) / (here.length - 1) : CX;
        pos[n.id] = { x, y: ROW_Y, onTap: Math.abs(x - CX) < 2 };
      });
    } else {
      const top = b.top + (b === firstTeam ? HEAD : 0) + 34;
      BRANCHES.forEach((br, ci) => {
        const here = NODES.filter((n) => n.stage === s.id && n.branch === br.id);
        const r = rng(s.id + br.id);
        here.forEach((n, i) => { pos[n.id] = { x: colX(ci) + (r() - 0.5) * 12, y: top + i * SLOT + (r() - 0.5) * 6 }; });
      });
    }
  });

  // the taproot: from the seed to the foundations, then on down the middle
  const fanY = rowBand ? ROW_Y + 74 : GROUND + 200;
  root(`M ${CX} ${GROUND} C ${CX - 5} ${GROUND + 70}, ${CX + 5} ${ROW_Y - 60}, ${CX} ${ROW_Y}`, 7, 'tap', 0);
  // the foundations: one root spreading out across the business
  root(`M ${CX} ${ROW_Y} C ${CX - 200} ${ROW_Y - 10}, ${(CX + ROW_X0) / 2} ${ROW_Y + 12}, ${ROW_X0 - 24} ${ROW_Y + 4}`, 5, 'row', 0);
  root(`M ${CX} ${ROW_Y} C ${CX + 200} ${ROW_Y - 10}, ${(CX + ROW_X1) / 2} ${ROW_Y + 12}, ${ROW_X1 + 24} ${ROW_Y + 4}`, 5, 'row', 0);
  root(`M ${CX} ${ROW_Y} C ${CX + 4} ${ROW_Y + 40}, ${CX - 4} ${fanY - 30}, ${CX} ${fanY}`, 6, 'tap', 0);
  // the first wins hang off the seed
  NODES.filter((n) => stageOf[n.stage].layout === 'spread').forEach((n) => {
    const p = pos[n.id];
    root(`M ${CX} ${GROUND + 2} Q ${(CX + p.x) / 2} ${GROUND + 4}, ${p.x} ${p.y - 10}`, 3.2, 'seed:' + n.id, 0);
  });

  // each part of the business grows its own root from the bottom of the taproot, labelled where it starts
  const headY = firstTeam.top + 28;
  const headEls = {};
  BRANCHES.forEach((br, ci) => {
    const here = order.filter((id) => byId[id].branch === br.id && !shared(byId[id]));
    if (!here.length) return;
    const x = colX(ci);
    const nameLines = wrap(br.name, 14);
    const hh = nameLines.length * 16 + 12;
    const longest = Math.max(...nameLines.map((l) => l.length));
    const hw = Math.min(colW - 8, longest * 7.6 + 22);
    const hTop = headY - hh / 2, hBottom = headY + hh / 2;
    if (br.id !== 'core') root(`M ${CX} ${fanY} C ${CX} ${fanY + 52}, ${x} ${hTop - 58}, ${x} ${hTop}`, 3, br.id, -1);
    else root(`M ${CX} ${fanY} L ${CX} ${hTop}`, 4.6, br.id, -1);
    const g = mk('g', { class: 'head', tabindex: 0, role: 'button', 'aria-label': `Show only ${br.name}`, 'data-b': br.id }, heads);
    mk('rect', { x: x - hw / 2, y: hTop, width: hw, height: hh, rx: 9 }, g);
    const t = mk('text', { x, y: hTop + 19, 'text-anchor': 'middle' }, g);
    lines(t, x, nameLines, 16);
    headEls[br.id] = g;
    g.addEventListener('click', () => pick(only === br.id ? '' : br.id));
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(only === br.id ? '' : br.id); } });

    let prev = { x, y: hBottom };
    here.forEach((id, k) => {
      const p = pos[id];
      const midY = (prev.y + p.y) / 2;
      root(`M ${prev.x} ${prev.y} C ${prev.x} ${midY}, ${p.x} ${midY}, ${p.x} ${p.y}`, Math.max(1.4, 3.2 - k * 0.3), br.id, k);
      prev = p;
    });
    const r = rng('hair' + br.id);
    for (let h = 0; h < 2; h += 1) {
      const ex = prev.x + (r() - 0.5) * 46, ey = prev.y + 34 + r() * 18;
      mk('path', { d: `M ${prev.x} ${prev.y} Q ${prev.x + (r() - 0.5) * 14} ${(prev.y + ey) / 2}, ${ex} ${ey}`, class: 'root', stroke: '#D9762C', 'stroke-opacity': 0.3, 'stroke-width': 1 }, roots);
    }
  });

  // the seed itself: the EmberSeed flame on the ground line
  const seed = mk('g', { transform: `translate(${CX - 18} ${GROUND - 54}) scale(1.5)`, 'aria-hidden': 'true' }, svg);
  mk('circle', { cx: 12, cy: 15, r: 14, fill: 'url(#g-ember)' }, seed);
  mk('path', { d: 'M12 2.5c1.6 2.6 4.8 4.8 4.8 9a4.8 4.8 0 0 1-9.6 0c0-2 1-3.4 2.1-4.3.1 1.8 1 3 2.1 3.3-.4-2.6-.9-5.3.6-8Z', fill: 'none', stroke: '#C2410C', 'stroke-width': 1.8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, seed);
  mk('circle', { cx: 12, cy: 20.5, r: 1.3, fill: '#C2410C' }, seed);
  mk('text', { x: CX + 30, y: GROUND - 26, class: 'note' }, svg).textContent = T.seedNote;

  // nodes and their labels
  const nodeEls = {};
  NODES.forEach((n) => {
    const p = pos[n.id];
    if (!p) return;
    const st = stageOf[n.stage];
    const bandIndex = bands.findIndex((b) => b.s.id === n.stage);
    const g = mk('g', { class: 'node' + (st.layout === 'spread' ? ' seed' : '') + (bandIndex % 2 ? ' band-2' : ''), tabindex: 0, role: 'button', 'aria-label': `${n.name}. ${st.name}, ${branchOf[n.branch].name}.`, 'data-id': n.id }, nodesG);
    const r = st.layout === 'spread' ? 11 : st.layout === 'row' ? 9 : 8;
    mk('circle', { class: 'ring', cx: p.x, cy: p.y, r: r + 5 }, g);
    mk('circle', { class: 'dot', cx: p.x, cy: p.y, r }, g);
    mk('path', { class: 'tick', d: `M ${p.x - r * 0.45} ${p.y} l ${r * 0.3} ${r * 0.32} l ${r * 0.55} ${-r * 0.62}` }, g);
    mk('circle', { cx: p.x, cy: p.y, r: r + 14, fill: 'transparent' }, g);   // a bigger target for fingers
    let t;
    const big = !!st.layout;
    const ls = wrap(n.name, big ? 20 : LABEL_CHARS);
    if (p.onTap) {
      // the middle foundation sits on the taproot: a patch of the band's own colour lets the root pass behind its name
      const w = Math.max(...ls.map((l) => l.length)) * 7.6 + 16;
      mk('rect', { x: p.x - w / 2, y: p.y + r + 4, width: w, height: ls.length * 17 + 8, rx: 6, fill: bandIndex % 2 ? 'var(--map-band)' : 'var(--map-bg)' }, g);
    }
    t = mk('text', { x: p.x, y: p.y + r + 18, 'text-anchor': 'middle', class: 'label' + (big ? ' big' : '') }, g);
    lines(t, p.x, ls, big ? 17 : 15.5);
    nodeEls[n.id] = g;
    g.addEventListener('click', () => open(n.id));
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(n.id); } });
  });

  // ---- the parts of the business: show one ----
  let only = '';
  const chips = $('chips');
  const chipList = [{ id: '', name: 'Everything' }].concat(BRANCHES.filter((b) => NODES.some((n) => n.branch === b.id && !shared(n))));
  chips.innerHTML = chipList.map((b) => `<button type="button" class="chip" data-b="${esc(b.id)}" aria-pressed="${b.id === only}">${esc(b.name)}</button>`).join('');
  function pick(b) {
    only = b;
    chips.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.b === only)));
    paint();
    if (only && view === 'map') {
      const i = BRANCHES.findIndex((x) => x.id === only), sc = $('map-scroll');
      const scale = svg.getBoundingClientRect().width / W;
      sc.scrollTo({ left: Math.max(0, colX(i) * scale - sc.clientWidth / 2), behavior: 'smooth' });
    }
  }
  chips.addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (c) pick(c.dataset.b); });

  // ---- the view: map or list ----
  let view = window.matchMedia('(max-width: 760px)').matches ? 'list' : 'map';
  try { view = localStorage.getItem(KEY + '-view') || view; } catch { /* default */ }
  function setView(v) {
    view = v;
    $('mapview').hidden = v !== 'map';
    $('listview').hidden = v !== 'list';
    $('view-map').setAttribute('aria-pressed', String(v === 'map'));
    $('view-list').setAttribute('aria-pressed', String(v === 'list'));
    try { localStorage.setItem(KEY + '-view', v); } catch { /* fine */ }
  }
  $('view-map').addEventListener('click', () => setView('map'));
  $('view-list').addEventListener('click', () => setView('list'));

  function renderList() {
    $('listview').innerHTML = STAGES.map((s) => {
      const ids = order.filter((id) => byId[id].stage === s.id && (!only || byId[id].branch === only || stageOf[s.id].layout));
      if (!ids.length) return '';
      return `<section><h2>${esc(s.name)} <span>${esc(s.when)}</span></h2><p class="about">${esc(s.about)}</p><ul>${ids.map((id) => {
        const n = byId[id], mine = plan[id];
        return `<li><button type="button" class="item" data-id="${id}"><span class="b">${esc(branchOf[n.branch].name)}</span><span class="t">${esc(n.name)}${mine ? `<span class="state ${mine}">${mine === 'done' ? 'Done' : 'In my plan'}</span>` : ''}</span><span class="s">${esc(n.summary)}</span></button></li>`;
      }).join('')}</ul></section>`;
    }).join('');
  }
  $('listview').addEventListener('click', (e) => { const b = e.target.closest('.item'); if (b) open(b.dataset.id); });

  // ---- painting state onto the map ----
  let current = '';
  const trunk = (r) => r.branch === 'tap' || r.branch === 'row' || String(r.branch).startsWith('seed:');
  function routeOf(id) {
    const n = byId[id], st = stageOf[n.stage];
    if (st.layout === 'spread') return (r) => r.branch === 'seed:' + id;
    if (st.layout === 'row') return (r) => r.branch === 'tap' || r.branch === 'row';
    const k = order.filter((x) => byId[x].branch === n.branch && !shared(byId[x])).indexOf(id);
    return (r) => r.branch === 'tap' || (r.branch === n.branch && r.upTo <= k);
  }
  function paint() {
    const lit = current ? routeOf(current) : null;
    rootEls.forEach((r) => {
      r.el.classList.toggle('dim', !!only && r.branch !== only && !trunk(r));
      r.el.classList.toggle('lit', !!(lit && lit(r)));
    });
    Object.entries(headEls).forEach(([b, g]) => {
      g.classList.toggle('picked', b === only);
      g.classList.toggle('dim', !!only && b !== only);
    });
    NODES.forEach((n) => {
      const g = nodeEls[n.id];
      if (!g) return;
      g.classList.toggle('dim', !!only && n.branch !== only && !shared(n));
      g.classList.toggle('done', plan[n.id] === 'done');
      g.classList.toggle('next', plan[n.id] === 'next');
      g.classList.toggle('on', n.id === current);
    });
    const done = Object.values(plan).filter((v) => v === 'done').length, next = Object.values(plan).filter((v) => v === 'next').length;
    $('plan').innerHTML = done || next
      ? `<span>My plan: <b>${done}</b> done · <b>${next}</b> next</span><button type="button" class="linkish" id="clear">Clear</button>`
      : `<span>${esc(T.planHint)}</span>`;
    const clear = $('clear');
    if (clear) clear.addEventListener('click', () => { plan = {}; savePlan(); paint(); if (current) open(current, true); });
    renderList();
  }

  // ---- the panel ----
  const panel = $('panel'), scrim = $('scrim');
  let opener = null;
  function open(id, keepFocus) {
    const n = byId[id];
    if (!n) return;
    if (!keepFocus) opener = document.activeElement;
    current = id;
    const st = stageOf[n.stage], br = branchOf[n.branch];
    const i = order.indexOf(id), prev = order[i - 1], next = order[i + 1];
    const mine = plan[id] || '';
    const sources = (n.sources || []).map((s) => `<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>`).join(' · ');
    panel.innerHTML = `
      <button type="button" class="close" id="p-close" aria-label="Close">×</button>
      <p class="p-eyebrow">${esc(st.name)} · ${esc(br.name)}</p>
      <h2 id="p-title">${esc(n.name)}</h2>
      <p class="p-summary">${esc(n.summary)}</p>
      <dl class="facts"><div><dt>Usually takes</dt><dd>${esc(n.time)}</dd></div><div><dt>Typical running cost</dt><dd>${esc(n.cost)}</dd></div></dl>
      <section><h3>What it is</h3><p>${esc(n.what)}</p></section>
      <section><h3>Why it's worth it</h3><p>${esc(n.why)}</p>${sources ? `<p class="src">Sources: ${sources}</p>` : ''}</section>
      <section><h3>Do it yourself</h3><ol>${(n.steps || []).map((s) => `<li>${esc(s)}</li>`).join('')}</ol></section>
      ${(n.tools || []).length ? `<section><h3>Tools businesses use for this</h3><ul class="tools">${n.tools.map((t) => `<li>${esc(t)}</li>`).join('')}</ul><p class="src">${esc(T.toolsNote)}</p></section>` : ''}
      ${(n.risks || []).length ? `<section><h3>Watch out for</h3><ul class="plain">${n.risks.map((r) => `<li>${esc(r)}</li>`).join('')}</ul></section>` : ''}
      ${(n.after || []).length ? `<section><h3>Do these first</h3><ul class="before">${n.after.filter((a) => byId[a]).map((a) => `<li><button type="button" data-go="${a}">${esc(byId[a].name)}</button></li>`).join('')}</ul></section>` : ''}
      <div class="mine" role="group" aria-label="My plan">
        <button type="button" data-mine="next" aria-pressed="${mine === 'next'}">${mine === 'next' ? 'In my plan' : 'Add to my plan'}</button>
        <button type="button" data-mine="done" aria-pressed="${mine === 'done'}">${mine === 'done' ? 'Done' : 'Mark as done'}</button>
      </div>
      <div class="cta"><p>${esc(n.emberseed || T.ctaDefault)}</p><a class="btn" href="${esc(T.ctaUrl)}" target="_blank" rel="noopener">${esc(T.ctaLabel)}</a></div>
      <div class="nav">${prev ? `<button type="button" data-go="${prev}">← ${esc(byId[prev].name)}</button>` : '<span></span>'}${next ? `<button type="button" data-go="${next}">${esc(byId[next].name)} →</button>` : ''}</div>`;
    panel.hidden = false;
    scrim.hidden = false;
    panel.scrollTop = 0;
    try { history.replaceState(null, '', '#' + id); } catch { /* fine */ }
    paint();
    if (!keepFocus) $('p-close').focus();
  }
  function close() {
    panel.hidden = true;
    scrim.hidden = true;
    current = '';
    try { history.replaceState(null, '', location.pathname + location.search); } catch { /* fine */ }
    paint();
    if (opener && opener.focus) opener.focus();
  }
  panel.addEventListener('click', (e) => {
    if (e.target.closest('#p-close')) return close();
    const go = e.target.closest('[data-go]');
    if (go) return open(go.dataset.go, true);
    const m = e.target.closest('[data-mine]');
    if (m) {
      const v = m.dataset.mine;
      if (plan[current] === v) delete plan[current]; else plan[current] = v;
      savePlan();
      open(current, true);
    }
  });
  scrim.addEventListener('click', close);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !panel.hidden) close(); });

  // ---- the end of the page: how EmberSeed works, the evidence, and the sources ----
  const allSources = [];
  const seen = new Set();
  NODES.forEach((n) => (n.sources || []).forEach((s) => { if (!seen.has(s.u)) { seen.add(s.u); allSources.push(s); } }));
  $('after').innerHTML = `
    <section><h2>${esc(T.workTitle)}</h2><p class="lede" style="margin-top:0">${esc(T.workLede)}</p>
      <ol class="steps" style="margin-top:18px">${T.work.map((w) => `<li><b>${esc(w.title)}</b><span>${esc(w.text)}</span></li>`).join('')}</ol></section>
    <a class="bigcta" href="${esc(T.ctaUrl)}" target="_blank" rel="noopener">${esc(T.ctaLabel)}</a>
    ${(T.principles || []).length ? `<section><h2>${esc(T.principlesTitle)}</h2>
      <ul class="steps principles">${T.principles.map((p) => `<li><b>${esc(p.title)}</b><span>${esc(p.text)}</span>${p.src ? ` <a class="psrc" href="${esc(p.src.u)}" target="_blank" rel="noopener">${esc(p.src.t)}</a>` : ''}</li>`).join('')}</ul></section>` : ''}
    <section><h2>${esc(T.sourcesTitle)}</h2><p class="lede" style="margin-top:0;font-size:1rem">${esc(T.sourcesLede)}</p>
      <ol class="sources" style="margin-top:14px">${allSources.map((s) => `<li><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a></li>`).join('')}</ol></section>
    <div class="foot"><span>${esc(T.footLeft)}</span><span>${esc(T.footRight)}</span></div>`;

  setView(view);
  paint();
  const start = (location.hash || '').slice(1);
  if (start && byId[start]) open(start, true);
})();
</script>
</body>
</html>
