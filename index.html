<style>
/* Layout: a root system drawn on paper. The first win sits on the ground line under the EmberSeed flame; the
   foundations spread in one row beneath it; each part of the business grows its own root down through faint soil
   layers, so the deeper a capability sits, the more it asks of the business. Light and airy, like the website. */
:root {
  --paper: #FFFFFF;
  --paper-2: #F6F3EE;
  --ink: #1A1F2D;
  --ink-2: #3A4152;
  --muted: #5B6172;
  --rule: #E7E2DA;
  --ember: #C2410C;
  --ember-ink: #FFFFFF;
  --amber: #E39B3F;
  --map-bg: #FFFFFF;
  --map-band: #FAF8F4;
  --map-line: #EDE7DE;
  --map-ink: #1A1F2D;
  --map-muted: #6A7080;
  --map-pill: #FFFFFF;
  --map-pill-line: #E0D9CE;
  --map-node: #FFFFFF;
  --map-hover: #FDEEE3;
  --shadow: 0 18px 48px rgba(20, 24, 36, 0.16);
  --font-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Figtree', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --step-0: 1rem;
  --step-1: 1.125rem;
  --step-2: 1.375rem;
  --step-3: clamp(1.6rem, 1.2rem + 1.6vw, 2.1rem);
  --step-4: clamp(2.1rem, 1.4rem + 3.2vw, 3.5rem);
}
/* One look for everyone, white like the website (Andrew, 19 Oct 2026: "Keep it white for everyone"), so there are
   no dark-mode colours. */
:root { color-scheme: light; }

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: var(--step-0);
  line-height: 1.6; -webkit-font-smoothing: antialiased;
}
a { color: var(--ember); text-underline-offset: 3px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; letter-spacing: -0.015em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 6px; }

.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---- the site header, as on emberseedautomation.com.au and the AI News ---- */
.topbar { border-bottom: 1px solid var(--rule); }
.topbar .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 23px; letter-spacing: -0.01em; }
.topbar nav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px; font-size: 16px; font-weight: 500; }
.topbar nav a { color: var(--ink); text-decoration: none; padding: 8px 0; }
.topbar nav a[aria-current="page"] { color: var(--ember); }
.topbar nav a.navcta { background: var(--ember); color: var(--ember-ink); padding: 10px 18px; border-radius: 999px; font-weight: 600; }

/* ---- the opening ---- */
.intro { padding-block: 44px 28px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; align-items: end; }
.eyebrow { margin: 0 0 12px; font-weight: 700; font-size: 0.82rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ember); }
.intro h1 { margin: 0; font-size: var(--step-4); line-height: 1.04; font-weight: 750; }
.lede { margin: 18px 0 0; font-size: var(--step-1); color: var(--ink-2); max-width: 60ch; }
.context { margin: 14px 0 0; font-size: 0.92rem; color: var(--muted); max-width: 62ch; }
.context a { color: var(--muted); }
.howto { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
.howto li { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 12px; align-items: start; }
.howto .n { font-family: var(--font-display); font-weight: 750; font-size: 1.35rem; color: var(--ember); line-height: 1.2; }
.howto b { display: block; font-weight: 700; }
.howto span { color: var(--ink-2); font-size: 0.97rem; }

/* ---- the toolbar ---- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-block: 1px solid var(--rule); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding-block: 10px; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; padding: 6px 16px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chips { display: flex; gap: 6px; overflow-x: auto; min-width: 0; flex: 1 1 320px; padding-block: 2px; scrollbar-width: thin; }
.chip { flex: none; border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-size: 0.88rem; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.chip[aria-pressed="true"] { border-color: var(--ember); color: var(--ember); background: color-mix(in srgb, var(--ember) 8%, var(--paper)); }
.plan { display: flex; gap: 10px; align-items: center; font-size: 0.9rem; color: var(--muted); flex: none; }
.plan b { color: var(--ink); font-variant-numeric: tabular-nums; }
.linkish { border: 0; background: none; padding: 0; color: var(--ember); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 0.9rem; }

/* ---- the map ---- */
.mapwrap { padding-block: 24px 8px; max-width: 1440px; }
.map-scroll { overflow-x: auto; border-radius: 18px; background: var(--map-bg); border: 1px solid var(--map-line); }
#map { display: block; width: 100%; min-width: 1220px; height: auto; }
#map text { font-family: var(--font-body); }
#map .stage-name { font-family: var(--font-display); font-weight: 700; font-size: 16px; fill: var(--map-ink); }
#map .stage-when { font-size: 13px; fill: var(--map-muted); }
#map .note { font-size: 13px; fill: var(--map-muted); font-weight: 500; }
#map .label { font-size: 13px; fill: var(--map-ink); font-weight: 500; }
#map .label.big { font-size: 14px; font-weight: 600; }
#map .label, #map .note { paint-order: stroke; stroke: var(--map-bg); stroke-width: 5px; stroke-linejoin: round; }
#map .band-2 .label { stroke: var(--map-band); }
#map .head { cursor: pointer; }
#map .head rect { fill: var(--map-pill); stroke: var(--map-pill-line); stroke-width: 1; }
#map .head text { font-size: 13.5px; font-weight: 700; fill: var(--map-ink); }
#map .head:hover rect, #map .head:focus-visible rect { stroke: var(--ember); }
#map .head.picked rect { fill: var(--map-hover); stroke: var(--ember); stroke-width: 1.5; }
#map .head:focus { outline: none; }
#map .node { cursor: pointer; }
#map .node .dot { fill: var(--map-node); stroke: var(--ember); stroke-width: 2; transition: fill 0.15s ease; }
#map .node.seed .dot { stroke-width: 2.5; }
#map .node:hover .dot, #map .node:focus-visible .dot { fill: var(--map-hover); }
#map .node:focus { outline: none; }
#map .node:focus-visible .ring { stroke: var(--ink); stroke-width: 2; }
#map .node .ring { fill: none; stroke: transparent; }
#map .node.next .ring { stroke: var(--amber); stroke-dasharray: 3 3; stroke-width: 1.5; }
#map .node.done .dot { fill: var(--ember); }
#map .node.on .dot { fill: var(--ember); stroke: var(--ember); }
#map .node.on .label { font-weight: 700; }
#map .node .tick { fill: none; stroke: var(--map-node); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: none; }
#map .node.done .tick { display: inline; }
#map .root { fill: none; stroke-linecap: round; }
#map .dim { opacity: 0.18; transition: opacity 0.2s ease; }
#map .lit { stroke: var(--ember); }
.mapnote { margin: 10px 0 0; font-size: 0.85rem; color: var(--muted); }

/* ---- the list ---- */
.list { padding-block: 22px 8px; display: grid; gap: 34px; }
.list section { display: grid; gap: 10px; }
.list h2 { margin: 0; font-size: var(--step-2); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.list h2 span { font-family: var(--font-body); font-size: 0.9rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.list .about { margin: 0; color: var(--ink-2); max-width: 70ch; }
.list ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.item { width: 100%; text-align: left; border: 1px solid var(--rule); background: var(--paper); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; height: 100%; }
.item:hover { border-color: var(--ember); }
.item .t { font-weight: 700; display: flex; gap: 8px; align-items: center; }
.item .b { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ember); }
.item .s { font-size: 0.92rem; color: var(--ink-2); }
.state { font-size: 0.72rem; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: var(--paper-2); color: var(--muted); }
.state.done { background: var(--ember); color: var(--ember-ink); }

/* ---- the panel ---- */
.scrim { position: fixed; inset: 0; background: rgba(15, 19, 28, 0.3); z-index: 20; }
.panel {
  position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--paper); color: var(--ink);
  box-shadow: var(--shadow); overflow-y: auto; overscroll-behavior: contain;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 24px;
}
.panel .close { position: sticky; top: 0; float: right; border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; width: 38px; height: 38px; cursor: pointer; font-size: 1.2rem; line-height: 1; }
.panel .p-eyebrow { margin: 4px 0 8px; font-weight: 700; font-size: 0.78rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ember); }
.panel h2 { margin: 0; font-size: var(--step-3); line-height: 1.12; padding-right: 44px; }
.panel .p-summary { margin: 12px 0 0; font-size: var(--step-1); color: var(--ink-2); }
.facts { margin: 18px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.facts div { background: var(--paper-2); border-radius: 10px; padding: 10px 12px; }
.facts dt { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-weight: 600; font-size: 0.95rem; }
.panel section { margin-top: 22px; }
.panel h3 { margin: 0 0 6px; font-family: var(--font-body); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.panel p, .panel li { margin: 0; color: var(--ink); }
.panel ol, .panel ul.plain { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.tools { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tools li { border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; font-size: 0.88rem; }
.src { margin-top: 8px !important; font-size: 0.86rem; color: var(--muted) !important; }
.src a { color: var(--muted); }
.before { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.before button { border: 1px solid var(--ember); color: var(--ember); background: transparent; border-radius: 999px; padding: 3px 11px; font-size: 0.88rem; font-weight: 600; cursor: pointer; }
.cta { margin-top: 26px; background: var(--paper-2); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; }
.cta p { color: var(--ink-2); }
.cta a.btn { justify-self: start; background: var(--ember); color: var(--ember-ink); text-decoration: none; font-weight: 700; border-radius: 999px; padding: 10px 18px; }
.mine { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; }
.mine button { border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
.mine button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.nav { margin-top: 18px; display: flex; justify-content: space-between; gap: 10px; }
.nav button { border: 0; background: none; color: var(--ember); font-weight: 600; cursor: pointer; padding: 4px 0; }

/* ---- the close of the page ---- */
.after { padding-block: 48px 64px; display: grid; gap: 36px; }
.after h2 { margin: 0 0 10px; font-size: var(--step-3); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.steps li { border-top: 3px solid var(--ember); padding-top: 10px; }
.steps b { display: block; font-family: var(--font-display); font-size: 1.15rem; }
.steps span { font-size: 0.93rem; color: var(--ink-2); }
.principles li { border-top-color: var(--amber); }
.principles .psrc { display: block; margin-top: 6px; font-size: 0.8rem; color: var(--muted); }
.sources { columns: 2 300px; column-gap: 32px; font-size: 0.88rem; color: var(--muted); margin: 0; padding-left: 1.2em; }
.sources li { break-inside: avoid; margin-bottom: 6px; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; border-top: 1px solid var(--rule); padding-top: 18px; font-size: 0.88rem; color: var(--muted); }
.bigcta { justify-self: start; background: var(--ember); color: var(--ember-ink); text-decoration: none; font-weight: 700; border-radius: 999px; padding: 14px 24px; font-size: 1.05rem; }

@media (max-width: 860px) {
  .intro { grid-template-columns: minmax(0, 1fr); gap: 26px; padding-block: 36px 20px; }
  .steps { grid-template-columns: minmax(0, 1fr); }
}
</style>
<style>body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }</style>
</head>
<body>
<script id="playbook-data" type="application/json">{"text":{"kicker":"EmberSeed AI Playbook","headline":"Start with one win. Then grow AI into every part of the business.","lede":"A free map for leaders who already use AI and want it doing real work. Every node is one capability: what it is, why it pays, how to do it yourself, the tools, the time and cost, and what to watch out for. The deeper a node sits, the more it asks of your business, so work down from the top.","howto":[{"title":"Pick your first win","text":"Two ways to save hours inside a week, in tools you already have. Start with the one that hurts most."},{"title":"Lay the foundations","text":"Rules, skills, one AI set up properly, and data it can safely reach. Everything below draws on them."},{"title":"Follow the roots you need","text":"Choose the parts of your business that matter, and go only as deep as pays its way."}],"mapnote":"On a smaller screen, scroll the map sideways or switch to the List. Your ticks are kept in this browser only.","seedNote":"Start here","planHint":"Open a node to add it to your plan.","toolsNote":"Examples, not endorsements. Start with what you already pay for.","ctaDefault":"EmberSeed can build this with your team.","ctaUrl":"https://emberseedautomation.com.au/#contact","ctaLabel":"Book a free 20-minute chat","workTitle":"Rather not walk it alone?","workLede":"EmberSeed builds these with you, in your own accounts, and leaves your team able to run them.","work":[{"title":"Listen","text":"We talk through your week and find the job that costs the most."},{"title":"Plan","text":"A short written plan: what working means, and the number it should move."},{"title":"Build","text":"Built in the tools you already pay for. You own it from day one."},{"title":"Implement","text":"Switched on with your team, with a runbook and a named owner."},{"title":"Train","text":"Hands-on training on real work, then a check-in to fine-tune it."}],"sourcesTitle":"Where this comes from","sourcesLede":"Built in October 2026 from Australian government guidance, published research on how small and medium businesses adopt AI, vendor documentation, and the systems EmberSeed runs itself. Times and costs are typical, not quotes.","footLeft":"EmberSeed is a trading name of Wilderness Properties Pty Ltd · ACN 614 946 897 · Mylor SA 5153","footRight":"Updated October 2026","context":"43% of Australian SMEs say they use AI, yet most firms can't see it in their results yet. The ones that do start with one outcome, train their people and change one workflow at a time. This map follows that order.","contextSources":[{"t":"National AI Centre: AI adoption insights, Dec 2025 to Feb 2026 (May 2026)","u":"https://www.ai.gov.au/news-and-insights/blog/ai-adoption-insights-december-2025-february-2026"},{"t":"Federal Reserve Bank of Atlanta: firm data on AI (Mar 2026)","u":"https://atlantafed.org/research-and-data/publications/working-papers/2026/03/24/03-firm-data-on-ai"}],"principlesTitle":"What the evidence says","principles":[{"title":"Start with an outcome, not a tool","text":"Pick the job and the number it should move, and measure it before you change anything.","src":{"t":"MIT NANDA: The GenAI Divide, State of AI in Business 2025","u":"https://mlq.ai/media/quarterly_decks/v0.1_State_of_AI_in_Business_2025_Report.pdf"}},{"title":"Simple rules in week one","text":"A named owner, a one-page policy, a register and human review, grown as your use grows.","src":{"t":"National AI Centre: Guidance for AI adoption, Foundations (Oct 2025)","u":"https://www.ai.gov.au/sites/default/files/2026-07/Guidance-for-AI-adoption-foundations_2.pdf"}},{"title":"Train on real work","text":"Five or more hours of hands-on training with coaching is what turns licences into habits.","src":{"t":"BCG: AI at Work 2025","u":"https://www.bcg.com/publications/2025/ai-at-work-momentum-builds-but-gaps-remain"}},{"title":"One workflow at a time","text":"Redesign one process with an owner and a metric; add agents only where simpler tools fall short.","src":{"t":"Anthropic: Building effective agents (Dec 2024)","u":"https://www.anthropic.com/engineering/building-effective-agents"}},{"title":"Buy before you build","text":"Tools from specialist vendors reach deployment about twice as often as internal builds.","src":{"t":"MIT NANDA: The GenAI Divide, State of AI in Business 2025","u":"https://mlq.ai/media/quarterly_decks/v0.1_State_of_AI_in_Business_2025_Report.pdf"}}]},"stages":[{"id":"seed","name":"The first win","when":"Week 1","layout":"spread","about":"Pick one. Each is live inside a week in tools you already have, saves time from the first day, and shows your team what AI can do with their own work."},{"id":"roots","name":"Foundations","when":"Weeks 1–4","layout":"row","about":"What every later step draws on: rules people trust, skills everyone shares, one AI set up properly, and data it can reach safely."},{"id":"quick","name":"Quick wins by team","when":"Months 1–2","about":"One or two jobs per team that AI does well today with off-the-shelf tools. Low risk, measured in days."},{"id":"connected","name":"Connected systems","when":"Months 2–6","about":"AI joined to the systems you run on (email, CRM, accounting, jobs) so work moves between them without retyping. Each needs the foundations in place."},{"id":"deep","name":"Agents and custom tools","when":"Months 6–12","about":"AI that works on a schedule or makes first calls on its own, with approvals, logs and a named owner. Worth it only where the layers above are solid."}],"branches":[{"id":"marketing","name":"Marketing","short":"Marketing"},{"id":"sales","name":"Sales","short":"Sales"},{"id":"care","name":"Customer care","short":"Customers"},{"id":"finance","name":"Finance","short":"Finance"},{"id":"people","name":"People and HR","short":"People"},{"id":"core","name":"Whole business","short":"Whole business"},{"id":"ops","name":"Operations","short":"Operations"},{"id":"risk","name":"Safety, legal and risk","short":"Safety & legal"},{"id":"product","name":"Products and services","short":"Products"},{"id":"stock","name":"Stock and purchasing","short":"Stock"},{"id":"field","name":"Fleet and field work","short":"Fleet & field"}],"nodes":[{"id":"second-brain","name":"A second brain on the wall","stage":"seed","branch":"core","summary":"An AI-kept wiki of how your business works, with today's key numbers on a screen everyone walks past.","what":"Claude or ChatGPT keeps a plain-text wiki of your business: clients, prices, suppliers, decisions, how-tos and who to call. You drop in documents and notes; it files them, links related pages and answers questions, naming the page it used. A small screen in the office (or on the fridge) shows the five or six numbers that matter today, refreshed every hour from your own systems.","why":"Most small businesses run on knowledge held in one or two heads, and businesses that write their processes down get far more from AI: in Xero's 2026 study of 524 accounting practices, 94% of daily AI users had well-documented processes, against 40% of non-users. A screen people pass every day turns checking the numbers into a habit. Andrej Karpathy's LLM wiki pattern (raw sources, an AI-maintained wiki, one rules file) runs on tools you already have.","sources":[{"t":"Andrej Karpathy: LLM wiki (2026)","u":"https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f"},{"t":"Xero: accounting practices using AI for growth (Sep 2026)","u":"https://www.xero.com/au/media-releases/australias-top-accounting-and-bookkeeping-practices-leveraging-ai-for-growth-not-job-cuts/"},{"t":"TRMNL e-ink dashboard (Little Bird Electronics)","u":"https://littlebirdelectronics.com.au/products/trmnl-e-ink-dashboard-7-5-inch"}],"steps":["Write down the 20 questions staff ask you most, and the six numbers you check most often.","Make one folder for raw material (documents, emails, notes) and one for the wiki: a page per client, product, process and decision.","Give the AI a one-page rules file: what goes where, how pages are named, and what never goes in (staff, health and banking details).","Let it draft pages from the raw folder, then correct them. Ask it the 20 questions and fill the gaps.","Feed the screen from a spreadsheet or script that reads your accounting, CRM or job system every hour, and spend 15 minutes each Friday on the wiki."],"tools":["Claude or ChatGPT Projects","Obsidian, Notion or GitHub","Google Apps Script or Power Automate","A TRMNL e-ink screen, old tablet or TV"],"time":"3–7 days","cost":"A$0–60 a month, plus A$150–600 for a screen","risks":["A wiki nobody corrects goes quietly wrong. Name one owner and keep the weekly review.","Keep HR, health and banking details out, and keep sensitive numbers off a wall that visitors can see."],"emberseed":"EmberSeed runs on one of these: Andrew's wiki feeds the screen on his desk and an app on his phone. As an AI Quick Win it's live in 7 days, in your own accounts."},{"id":"paperwork","name":"Invoices and receipts on autopilot","stage":"seed","branch":"core","summary":"Bills and receipts in your inbox arrive coded in Xero or MYOB; your own invoices go out and get chased.","what":"Every bill, receipt and statement that arrives by email goes to one address. AI reads the supplier, ABN, date, amounts and GST, suggests the account from your history and drafts the bill in Xero or MYOB with the PDF attached; a person approves and pays. Going the other way, invoices are raised from finished jobs or accepted quotes, sent with a payment link and reminded on a schedule.","why":"Keying in bills is some of the most repetitive work in a small business, and capture-and-code tools for Xero and MYOB are mature and inexpensive, so the time comes back in the first week. Payment-redirection scams cost Australians A$166.8 million in 2025, which is why a person still approves every payment and any change of bank details gets a phone call.","sources":[{"t":"Xero: the agentic era for small business finance (Xerocon 2026)","u":"https://blog.xero.com/us/product-updates/xerocon-london-2026-agentic-era-small-business-finance/"},{"t":"Xero: smart document capture (Jul 2026)","u":"https://blog.xero.com/product-updates/smart-document-capture/"},{"t":"ApprovalMax AI bill checks for Xero (2026)","u":"https://itbrief.co.uk/story/approvalmax-launches-ai-bill-checks-for-xero-users"},{"t":"iTWire: Scams Awareness Week 2026","u":"https://itwire.com/business-it-news/security/scams-awareness-week-what-australians-need-to-know-in-2026"}],"steps":["Create a bills@ address and send it into your capture tool: Hubdoc or Dext, or Xero's own capture (still in beta in Australia).","Ask your top 20 suppliers to send bills there, and add a mail rule that forwards anything else with an invoice attached.","Set supplier rules for account, tax code and approver; keep new suppliers on manual review.","Approve the first fortnight by hand and correct the codes so the rules learn. Ring the supplier, on a number you already hold, about any change of bank details.","Turn on invoice reminders and payment receipts in your accounting system, and have finished jobs or accepted quotes raise the invoice."],"tools":["Xero (JAX, Hubdoc)","MYOB","Dext","ApprovalMax","Gmail or Outlook rules"],"time":"1–5 days","cost":"Often included in Xero or MYOB; add-ons from about A$30 a month","risks":["Fake and altered invoices arrive by email too. A person approves every payment and checks bank-detail changes by phone.","Wrong GST or coding compounds quietly. Check a sample each month and before each BAS."],"emberseed":"An AI Quick Win, set up with your bookkeeper in your own Xero or MYOB, live within 7 days."},{"id":"policy","name":"A one-page AI policy","stage":"roots","branch":"core","summary":"Plain rules for which AI tools staff may use, what can go into them, and who checks the output.","what":"One page your team will read: the approved tools, the information that never goes into AI (client personal details, passwords, health and banking information), when a person must check AI output before it leaves the business, and who to ask. Alongside it sits a simple register of every AI tool in use, what it touches and who owns it.","why":"Staff already use AI on their own terms: 48% of Australian employees say they have used it against policy. Australia's Guidance for AI Adoption starts with a named owner, a policy and a register of AI use (including AI built into other software), and ai.gov.au has free templates for both.","sources":[{"t":"KPMG and the University of Melbourne: Trust in AI (2025)","u":"https://kpmg.com/au/en/insights/artificial-intelligence-ai/trust-in-ai-global-insights-2025.html"},{"t":"National AI Centre: Guidance for AI adoption, Foundations (Oct 2025)","u":"https://www.ai.gov.au/sites/default/files/2026-07/Guidance-for-AI-adoption-foundations_2.pdf"},{"t":"National AI Centre: planning tools and templates (2026)","u":"https://www.ai.gov.au/practical-guides-and-learning/planning-tools-and-templates"},{"t":"National AI Centre: manage unapproved AI use","u":"https://www.ai.gov.au/staying-safe-and-responsible/manage-unapproved-ai-use"}],"steps":["Ask staff, without blame, which AI tools they use and for what. Unapproved use usually points to a real need.","List the approved tools and move work onto business accounts.","Write the never-share list and the check-before-it-leaves rule in plain words.","Start the register: tool, owner, what data it touches, who checks it.","Review both every quarter, or whenever you add a tool."],"tools":["National AI Centre policy and register templates","A shared document and spreadsheet"],"time":"1–3 days","cost":"A$0","risks":["A policy nobody hears about changes nothing. Walk the team through it in 20 minutes.","Banning AI outright pushes it out of sight."],"emberseed":"Part of AI-Ready by 10 December: the register, the one-page policy, a staff session, and privacy-policy wording for your lawyer to approve."},{"id":"literacy","name":"AI basics for everyone","stage":"roots","branch":"core","summary":"A hands-on session on real work, so every person can use your AI safely, and knows when not to.","what":"Two practical hours with each team, using their own tasks: how to brief the AI, check what it gives back, keep private information out, and spot when it's confidently wrong. It's recorded, comes with a one-page guide, and has a follow-up a week later.","why":"Only 24% of Australians have had any AI training. BCG found five or more hours of hands-on training with coaching sharply lifts regular use, and the Australian Public Service's Copilot trial found tailored training and internal champions were what made it stick.","sources":[{"t":"KPMG and the University of Melbourne: Trust in AI (2025)","u":"https://kpmg.com/au/en/insights/artificial-intelligence-ai/trust-in-ai-global-insights-2025.html"},{"t":"BCG: AI at Work 2025","u":"https://www.bcg.com/publications/2025/ai-at-work-momentum-builds-but-gaps-remain"},{"t":"Digital Transformation Agency: Copilot trial evaluation (2024)","u":"https://www.digital.gov.au/initiatives/copilot-trial/summary-evaluation-findings/cts-executive-summary"},{"t":"National AI Centre: training","u":"https://www.ai.gov.au/practical-guides-and-learning/training"}],"steps":["Pick three real tasks per team that AI could speed up.","Show the brief, check, improve loop on those tasks, live.","Practise the never-share list and checking output for errors.","Give everyone the one-page guide and a shared place for prompts that work.","Check back after a week and fix what didn't stick."],"tools":["Your chosen AI (Copilot, Gemini, ChatGPT or Claude)","Free courses: National AI Centre microskills, TAFE SA AI Essentials, Microsoft Elevate"],"time":"2 hours per team, plus a follow-up","cost":"A$0 in tools","risks":["One-off training fades. Keep a monthly ten-minute 'what worked' slot.","Toy examples teach nothing. Use the team's real work."],"emberseed":"A Team AI Workshop: two hands-on hours for up to 20 staff, built around your team's real tasks."},{"id":"platform","name":"One AI, set up properly","stage":"roots","branch":"core","summary":"Business accounts for the AI you already pay for, with data protection on, instead of everyone's free accounts.","what":"Choose one main AI for the business, usually the one inside what you already pay for: Copilot in Microsoft 365, Gemini in Google Workspace, or a ChatGPT or Claude business plan. Switch on its business data protections, connect it read-only to email, files and calendar, and retire the free accounts people were using for work.","why":"Your staff probably bring their own AI already: Microsoft found 80% of AI users at small and medium businesses use their own tools, and MIT found workers at over 90% of firms use personal AI accounts while only 40% of firms pay for business plans. Business plans keep your data out of model training and give you admin control, for about US$20–30 per user a month.","sources":[{"t":"Microsoft Work Trend Index (May 2024)","u":"https://www.microsoft.com/en-us/worklab/work-trend-index/ai-at-work-is-here-now-comes-the-hard-part"},{"t":"MIT NANDA: The GenAI Divide, State of AI in Business 2025","u":"https://mlq.ai/media/quarterly_decks/v0.1_State_of_AI_in_Business_2025_Report.pdf"},{"t":"Pax8: Microsoft 365 Copilot Business for SMB (2026)","u":"https://www.pax8.com/blog/microsoft-365-copilot-business-smb-offers"},{"t":"Tech.co: Gemini Enterprise plans (2026)","u":"https://tech.co/news/new-gemini-enterprise-plans"}],"steps":["Check what your Microsoft 365 or Google Workspace plan already includes.","Pick one main AI, and add a second only for a clear reason.","Turn on business data controls and multi-factor sign-in; connect email, files and calendar read-only to start.","Set up shared projects for common work: quotes, reports, replies.","Move work off personal AI accounts."],"tools":["Microsoft 365 Copilot","Gemini in Google Workspace","ChatGPT Business","Claude Team"],"time":"1–2 days","cost":"About US$20–30 per user a month, sometimes already in your plan","risks":["Connecting everything on day one. Start read-only and widen access as trust grows.","Seats nobody uses. Review licences each quarter."],"emberseed":"Included in every Quick Win and Sprint: EmberSeed builds in the AI you already pay for."},{"id":"data-ready","name":"Data the AI can reach","stage":"roots","branch":"core","summary":"Tidy shared files, sensible permissions and one source of truth, so AI answers from current, allowed information.","what":"AI connected to your files can find anything the person using it could, including the old price list and the payroll folder someone shared with everyone. This step archives stale material, fixes sharing, and names the one place each kind of information lives.","why":"AI answers are only as current and as private as the files behind them, and Copilot and Gemini follow your existing permissions, so an over-shared folder becomes an over-shared answer. The National AI Centre advises cleaning up data for the job at hand, one document type at a time, rather than everything first.","sources":[{"t":"National AI Centre: explore ways to use AI","u":"https://www.ai.gov.au/practical-guides-and-learning/explore-ways-use-ai"}],"steps":["List where each kind of information lives: clients, prices, jobs, policies.","Archive superseded files and duplicate folders.","Fix sharing on HR, payroll and finance folders before you connect AI.","Name one source of truth for prices and client details.","Ask the AI questions it shouldn't be able to answer, and close what it finds."],"tools":["SharePoint and OneDrive sharing reports","Google Drive sharing settings","Your CRM or job system as the source of truth"],"time":"2–10 days, depending on the mess","cost":"A$0","risks":["Two versions of the price list means two answers.","Don't connect AI to folders you haven't checked."],"emberseed":"The review at the start of every AI Launch Sprint, before anything is connected."},{"id":"baseline","name":"Know your numbers first","stage":"roots","branch":"core","summary":"Measure hours, turnaround and errors before you change anything, so you can see what AI actually saves.","what":"Pick the one or two measures each change should move (hours a week on a task, days to send a quote, invoices paid on time, missed calls) and record them for two weeks before you start. Measure again after a month and after three.","why":"Most firms can't yet see AI in their results: in a 2026 survey of about 6,000 executives in four countries, including Australia, more than 80% reported no productivity effect so far, and Deloitte found only 6% of companies see AI pay back within a year. A baseline turns 'it feels faster' into a number for the next decision, and stops effort going into work that doesn't pay.","sources":[{"t":"Federal Reserve Bank of Atlanta: firm data on AI (Mar 2026)","u":"https://atlantafed.org/research-and-data/publications/working-papers/2026/03/24/03-firm-data-on-ai"},{"t":"Deloitte: AI ROI, the paradox of rising investment and elusive returns (Oct 2025)","u":"https://www.deloitte.com/global/en/what-we-do/capabilities/ai/research/ai-roi-the-paradox-of-rising-investment-and-elusive-returns.html"}],"steps":["Choose one or two measures for each job you'll change.","Time the job for two weeks, as it is today.","Write down what 'working' will mean before anything is built.","Measure again after a month and after three.","Keep the numbers with the build's notes, where the next decision will find them."],"tools":["A shared spreadsheet","Your systems' own reports"],"time":"2 weeks alongside normal work","cost":"A$0","risks":["Measuring everything means measuring nothing. Pick one or two.","Don't count the same hours saved in two projects."],"emberseed":"Every EmberSeed build starts with a written definition of 'working' and a number from before."},{"id":"security","name":"Security for the AI era","stage":"roots","branch":"core","summary":"Multi-factor sign-in, backups, and a team that can spot cloned voices and AI-written invoices.","what":"The basics that prevent most damage: multi-factor sign-in everywhere, automatic updates, tested backups, and a rule that money moves only after a call back on a number you already hold. Then the AI habits: no secrets pasted into AI, care with links in AI answers, and AI agents given only the access they need.","why":"AI makes scams cheaper and more convincing, and the average cybercrime cost to an Australian small business was A$56,600 in 2024–25. The Australian Signals Directorate's 2026 guide on AI for small business says to set rules for what data goes into AI, check vendors' settings, verify outputs and keep a person in charge.","sources":[{"t":"Australian Signals Directorate: AI for small business (Jan 2026)","u":"https://www.cyber.gov.au/publication/artificial-intelligence-for-small-business"},{"t":"ACSC: Annual Cyber Threat Report 2024–25, business factsheet","u":"https://www.cyber.gov.au/sites/default/files/2025-10/Annual%20Cyber%20Threat%20Report%202024-25%20factsheet%20for%20businesses%20and%20organisations.pdf"},{"t":"Simon Willison: the lethal trifecta for AI agents (2025)","u":"https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/"}],"steps":["Turn on multi-factor sign-in for email, banking, accounting and AI tools.","Switch on automatic updates and test a restore from backup.","Adopt the call-back rule for bank-detail changes and urgent payment requests.","Give AI tools and agents read-only access unless they truly need more.","Run a 15-minute scam drill with the team each quarter."],"tools":["The ACSC's small business guides","Microsoft 365 or Google Workspace security settings","A password manager"],"time":"1–3 days","cost":"Mostly included in what you pay for","risks":["An agent that reads email and can also send it can be tricked. Keep a person approving anything that leaves the business."],"emberseed":"Built into every EmberSeed build. For a full security review, EmberSeed works with a specialist partner."},{"id":"privacy","name":"Privacy-ready by 10 December","stage":"roots","branch":"core","summary":"Know what personal information goes into AI, and say so in your privacy policy before the new rules start.","what":"From 10 December 2026, businesses covered by the Privacy Act must say in their privacy policy when software makes, or substantially and directly helps make, decisions that could significantly affect people, and what personal information it uses. The regulator's final guidance (30 September 2026) says this can include rule-based tools and spreadsheets, often even when a person reviews the result. This step maps where personal information meets AI and drafts the wording for your lawyer to approve.","why":"The duty sits with the business using the tool, not the vendor. The small-business exemption (A$3 million turnover or less) is still law, but it doesn't cover some businesses, such as health service providers, and most firms with 5–200 staff turn over more than A$3 million.","sources":[{"t":"OAIC: new resources on transparency for AI and automated decisions (Sep 2026)","u":"https://www.oaic.gov.au/news/media-centre/new-resources-on-transparency-for-use-of-ai-and-automated-decision-making"},{"t":"Allens: automated decision-making disclosure, key takeaways (Oct 2026)","u":"https://www.allens.com.au/insights-news/insights/2026/10/mandatory-automated-decision-making-disclosure-requirements-are-coming-key-takeaways-from-the-oaic-guidance/"},{"t":"Gilbert + Tobin: automated decision-making transparency under the Privacy Act","u":"https://www.gtlaw.com.au/insights/automated-decision-making-transparency-under-the-privacy-act"},{"t":"OAIC: privacy and commercially available AI products","u":"https://www.oaic.gov.au/privacy/privacy-guidance-for-organisations-and-government-agencies/guidance-on-privacy-and-the-use-of-commercially-available-ai-products"}],"steps":["Check whether the Privacy Act covers your business.","List every AI tool that touches personal information.","Mark any decisions that significantly affect people: pricing, credit, hiring, eligibility.","Draft privacy-policy wording and have your lawyer approve it.","Add the review date to your AI register."],"tools":["OAIC guidance on AI and privacy","Your AI register"],"time":"1–2 weeks","cost":"A$0, plus your lawyer's review","risks":["This isn't legal advice. Have a lawyer approve the final wording."],"emberseed":"AI-Ready by 10 December: the register, a one-page policy, a staff session and draft wording for your lawyer."},{"id":"meetings","name":"Meetings that write their own actions","stage":"quick","branch":"core","summary":"Every meeting ends with notes, decisions and tasks in the right place, without anyone typing them up.","what":"Your meeting tool records and transcribes the meeting, then AI writes the summary, the decisions and each person's tasks, and sends them where work is tracked (Teams, Slack, monday.com or your CRM). People correct the summary in a minute instead of writing it in half an hour.","why":"Meeting follow-up is one of the commonest and most measurable time sinks, and the tools come with what most businesses already pay for. In the Australian Public Service's Copilot trial, summarising was among the biggest time savers: up to an hour a task, by participants' own estimates.","sources":[{"t":"Digital Transformation Agency: Copilot trial evaluation (2024)","u":"https://www.digital.gov.au/initiatives/copilot-trial/summary-evaluation-findings/cts-executive-summary"},{"t":"SA Law Handbook: recording conversations","u":"https://lawhandbook.sa.gov.au/ch34s01s04.php"}],"steps":["Switch on transcription and AI notes in Teams, Meet or Zoom, or add a note-taker.","Agree a standard summary: decisions, actions with owners and dates, open questions.","Send actions to where your team already tracks work.","Tell everyone when a meeting is recorded, and ask clients first.","Check summaries for a fortnight, then spot-check."],"tools":["Copilot in Teams","Gemini in Google Meet","Zoom AI Companion","Fireflies or Otter","monday.com, Asana or Slack"],"time":"1–2 days","cost":"Often included; dedicated note-takers about US$10–20 per user a month","risks":["In South Australia, recording a private conversation needs every party's consent. Say so at the start.","Summaries can miss nuance. The meeting owner checks before actions go out."],"emberseed":"A typical AI Quick Win: live in a week in your own meeting tools, with a summary template your team agrees on."},{"id":"helpers","name":"Shared helpers for repeat jobs","stage":"quick","branch":"core","summary":"Saved AI assistants for the jobs you do every week, so everyone gets the same good result.","what":"Turn your best prompts into saved helpers that anyone can use: a quote writer that knows your prices, a reply writer that knows your tone, a report builder that knows your format. Each one carries its instructions, examples and reference files, so nobody starts from a blank box.","why":"Shared helpers spread one person's best practice across the team and keep output consistent. Skills are now an open standard, so a well-written helper isn't locked to one vendor.","sources":[{"t":"VentureBeat: Anthropic opens the Agent Skills standard (Dec 2025)","u":"https://venturebeat.com/ai/anthropic-launches-enterprise-agent-skills-and-opens-the-standard"}],"steps":["List the five written jobs your team repeats most.","For each, collect three good examples and the rules behind them.","Build the helper with its instructions, examples and reference files.","Let two people use it for a week and refine it.","Name an owner for each helper and review it each quarter."],"tools":["Claude Projects and Skills","Custom GPTs","Gemini Gems","Copilot agents"],"time":"1–3 days","cost":"Included in business AI plans","risks":["Helpers built on stale prices or policies spread errors fast. Point them at the source of truth, not copies.","Too many helpers and nobody finds the right one. Start with five."],"emberseed":"Usually part of an AI Quick Win or a Team AI Workshop."},{"id":"connect","name":"Connect your systems once","stage":"connected","branch":"core","summary":"Join email, CRM, accounting and jobs through connectors, so AI and automations move work between them.","what":"One connection layer lets your AI read from (and, where you allow it, write to) the systems you run on. Xero, HubSpot, Google Workspace, Microsoft 365, Slack and monday.com now offer official connectors for AI assistants; automation tools such as Zapier, Make, n8n and Power Automate fill the gaps.","why":"Most of the value left in AI for small businesses sits in the handoffs between systems, where people retype, copy and chase. Connectors that follow an open standard (the Model Context Protocol) let you change AI vendors later without rebuilding everything.","sources":[{"t":"Xero: Claude integration (May 2026)","u":"https://www.xero.com/au/media-releases/xero-delivers-claude-integration-to-advance-ai-powered-financial-intelligence/"},{"t":"HubSpot: remote MCP server generally available (Apr 2026)","u":"https://developers.hubspot.com/changelog/remote-hubspot-mcp-server-is-now-generally-available"},{"t":"Google Workspace: agent tools for developers (May 2026)","u":"https://workspaceupdates.googleblog.com/2026/05/agent-tools-and-security-updates-for-workspace-developers.html"}],"steps":["Draw how work moves between your systems today, and mark where people retype.","Connect each system to your AI read-only, and test ten real questions.","Allow writing one system at a time, with approval before anything is sent or paid.","Use an automation tool for systems without a connector.","Keep a list of every connection, its owner and its access."],"tools":["Model Context Protocol connectors","Zapier","Make","n8n","Power Automate"],"time":"1–3 weeks","cost":"A$0–150 a month in automation and API fees","risks":["A connector that reads untrusted content and can also write is the riskiest setup. Separate the two, or add approval.","Vendors are changing fast. Keep your instructions and logic in files you own."],"emberseed":"The heart of an AI Launch Sprint: a review of how work moves, then 2–3 connected builds with training."},{"id":"reports","name":"Reports that write themselves","stage":"connected","branch":"core","summary":"The weekly numbers and the story behind them, assembled from your systems before Monday morning.","what":"A scheduled job pulls the week's figures from accounting, CRM, jobs and the website, compares them with last week and the target, and has AI write the three things that changed and why. It lands in your inbox, a shared page or the screen on the wall, with every number traceable to its source.","why":"Owners spend hours a week assembling the same report, or stop doing it. Automating it keeps the rhythm, and asking AI only to explain numbers that code has already calculated avoids invented figures.","sources":[{"t":"Claude: live artifacts in Cowork (2026)","u":"https://support.claude.com/en/articles/14729249-use-live-artifacts-in-claude-cowork"}],"steps":["Agree the eight to twelve numbers the business runs on, and where each comes from.","Have code fetch and calculate them; never let AI do the arithmetic.","Let AI write the commentary: what changed, why, and what to look at.","Schedule it for Sunday night, and send it where you'll read it.","Check it against the source each week for the first month."],"tools":["Google Apps Script","Power Automate","Looker Studio or Power BI","Claude live artifacts"],"time":"1–2 weeks","cost":"A$0–50 a month","risks":["A wrong number repeated every week becomes 'truth'. Link each figure to its source.","Vanity metrics. Report what you'd act on."],"emberseed":"A Sprint build. EmberSeed's own screen does this hourly from Google Analytics, Google Ads, Gmail and monday.com."},{"id":"agents","name":"Agents on a schedule","stage":"deep","branch":"core","summary":"AI that does a recurring job overnight (briefings, checks, follow-ups) and queues anything risky for approval.","what":"A background agent wakes on a schedule or an event, gathers what it needs from your connected systems, does the work (a morning brief, overdue-job chases, a stock check, a contract-renewal scan) and leaves the result where you'll see it. Anything that sends, posts or pays waits for a person.","why":"This is where AI starts to feel like extra staff, and where projects fail: Gartner expects over 40% of agentic AI projects to be cancelled by the end of 2027. Anthropic's own advice is to use the simplest pattern that works and add agents only when it doesn't, and the Australian Signals Directorate published guidance on adopting agentic AI carefully in May 2026.","sources":[{"t":"Gartner: 40% of agentic AI projects cancelled by 2027 (Jun 2025)","u":"https://www.gartner.com/en/newsroom/press-releases/2025-06-25-gartner-predicts-over-40-percent-of-agentic-ai-projects-will-be-canceled-by-end-of-2027"},{"t":"Anthropic: Building effective agents (Dec 2024)","u":"https://www.anthropic.com/engineering/building-effective-agents"},{"t":"Australian Signals Directorate: careful adoption of agentic AI services (May 2026)","u":"https://www.cyber.gov.au/publication/careful-adoption-of-agentic-ai-services"},{"t":"Claude Code routines (2026)","u":"https://code.claude.com/docs/en/routines"}],"steps":["Pick one recurring job with a clear start, finish and check.","Write its instructions as a skill file you keep, with examples of good and bad output.","Run it on a schedule, read-only at first, posting results for a person to review.","Add one action at a time, each behind an approval.","Log every run, and review the log weekly."],"tools":["Claude Code routines and Managed Agents","Microsoft Copilot Studio","Make or n8n agents","GitHub Actions"],"time":"2–6 weeks","cost":"A$20–200 a month in AI usage, depending on volume","risks":["Autonomous 'AI employees' are mostly hype. Bound each agent to one job.","Agent platforms change quickly. Keep the logic in files you own, so moving is cheap."],"emberseed":"Fractional AI Lead: a few hours a month to build, measure and improve agents with your team."},{"id":"check-ai","name":"Check and own the AI's work","stage":"deep","branch":"core","summary":"Test cases, action logs, runbooks and named owners, so your AI stays right and survives any one person.","what":"Every AI system gets a set of real test cases run after each change, a log of what it did, a weekly exceptions report, a runbook a newcomer could follow, and a named owner with a backup. It's the difference between a clever system and one the business can rely on.","why":"The more an AI system works, the less people check it, so errors spread quietly. Australia's Guidance for AI Adoption includes testing, monitoring and human control, and a single builder with no runbook is a business risk in its own right.","sources":[{"t":"Department of Industry: Guidance for AI Adoption (Oct 2025)","u":"https://www.industry.gov.au/publications/guidance-ai-adoption"},{"t":"Langfuse (open-source AI monitoring)","u":"https://langfuse.com/blog/joining-clickhouse"}],"steps":["Collect 30–100 real examples for each AI workflow, with the right answers.","Run them after every change of prompt, tool or model.","Log every action the AI takes, and send a weekly exceptions summary.","Write the runbook: what it does, how to pause it, who to call.","Name an owner and a backup, and rehearse a handover once."],"tools":["A spreadsheet of test cases","Langfuse","Promptfoo","Your AI register"],"time":"1–3 weeks, then a few hours a month","cost":"A$0–400 a month","risks":["Test sets that don't look like real work prove nothing. Use real cases.","Models change silently. Re-run the tests when the vendor updates."],"emberseed":"Built into every EmberSeed build: Andrew learnt the hard way that a brilliant system only one person understands is a liability."},{"id":"private-ai","name":"Private AI for sensitive work","stage":"deep","branch":"core","summary":"Keep sensitive data in Australia or on your own machine, with personal details removed before anything leaves.","what":"For health, legal, financial or personal information, route work to AI that runs in Australian data centres (such as Claude through Amazon Bedrock's Australian regions) or to an open model on your own computer. A small local step can remove names and identifiers before harder reasoning goes to a cloud model.","why":"Some clients, contracts and regulators expect data to stay onshore. Open models that run on a 16–32 GB machine have become good enough for summarising, classifying and redacting, though they still trail the best cloud models.","sources":[{"t":"AWS: Bedrock inference in Asia Pacific (2026)","u":"https://aws.amazon.com/blogs/machine-learning/run-generative-ai-inference-with-amazon-bedrock-in-asia-pacific-new-zealand/"}],"steps":["Classify your data: public, internal, confidential, sensitive.","Write the 'what may go where' rule for each class.","Route sensitive work to an Australian-hosted or local model.","Add redaction before anything sensitive reaches a cloud model.","Test quality on real cases before switching over."],"tools":["Amazon Bedrock (Sydney and Melbourne)","Ollama or LM Studio","Open models such as Gemma or Qwen"],"time":"2–6 weeks","cost":"A$1,500–6,000 of hardware, or pay-as-you-go cloud","risks":["Onshore isn't automatically compliant. Check what your obligations actually require.","Local models need upkeep. Someone owns the updates."],"emberseed":"Scoped in a Sprint; hardware and hosting are set up with a specialist partner where needed."},{"id":"mkt-voice","name":"Content in your voice","stage":"quick","branch":"marketing","summary":"Blogs, newsletters, posts and case studies drafted in your brand voice: one idea becomes ten pieces.","what":"A saved project holds your brand voice, approved claims, prices and best past work. From one piece (a case study, a talk, a job well done) it drafts the blog, the newsletter, three social posts and the web copy, which a person checks and publishes. Online stores use the same setup for product descriptions.","why":"Marketing is the commonest use of AI in Australian small businesses: NAB found 51% of SMEs that use AI apply it to marketing and sales. A voice and claims file is what stops the output sounding like everyone else's AI.","sources":[{"t":"IT Brief: NAB says 42% of Aussie SMEs use AI (Apr 2026)","u":"https://itbrief.com.au/story/nab-says-42-of-aussie-smes-use-ai-to-boost-productivity"}],"steps":["Collect ten pieces you're proud of and write down what makes them yours.","Build a voice and claims file: tone, words you use and avoid, facts you can prove.","Set up a saved project with the file and your examples.","Turn each new idea into a set: blog, newsletter, posts, web copy.","Check every claim before it goes out. You're responsible for what it says."],"tools":["Claude or ChatGPT Projects","Gemini Gems","Copilot","Canva"],"time":"2–4 days","cost":"Included in business AI plans","risks":["AI can invent statistics and testimonials. The Australian Consumer Law applies to AI-written ads too, so check every claim."],"after":["platform","helpers"],"emberseed":"An AI Quick Win: your voice file and content project, set up and taught to your team in a week."},{"id":"mkt-reviews","name":"Answer every review","stage":"quick","branch":"marketing","summary":"Every Google review answered within a day, and your business profile kept complete for local and AI search.","what":"AI drafts a reply to each new review in your voice (thanking, fixing or inviting a call) and you approve it. The same habit keeps your Google Business Profile complete: services, areas, hours, photos and answers to common questions, all matching your website and directory listings.","why":"AI search tools build answers from profiles, directories and reviews: a 2026 study of 1.3 million AI citations found directories foundational for local services, and 'best of' roundups supply over 20% of citations. A complete profile with answered reviews is the cheapest visibility a local business can buy.","sources":[{"t":"Squarespace: AI search for business owners (2026)","u":"https://www.squarespace.com/blog/ai-search-for-business-owners"},{"t":"PinMeTo: Google Business Profile updates (2026)","u":"https://www.pinmeto.com/blog/google-business-profile-updates-2026/"}],"steps":["Claim and complete your Google Business Profile, matching your website exactly.","Write three reply templates: praise, a fixable complaint, an unfair one.","Have AI draft each reply from the templates, and approve it.","Ask happy customers for reviews at the moment they're happiest.","Check your listings on the main directories each quarter."],"tools":["Google Business Profile","Gemini or ChatGPT","Your website platform"],"time":"1–2 days, then 10 minutes a week","cost":"A$0","risks":["Never post AI-written fake reviews or reward good ones. Both breach the Australian Consumer Law."],"after":["mkt-voice"],"emberseed":"Often part of an AI Quick Win. EmberSeed set up its own Google profile and search listings this way."},{"id":"mkt-ai-search","name":"Be found in AI search","stage":"connected","branch":"marketing","summary":"Make sure ChatGPT, Gemini and Google's AI answers name you, accurately, when buyers ask for what you sell.","what":"Track a fixed set of buyer questions each month across ChatGPT, Perplexity, Gemini and Google's AI Mode, and note who gets named. Then close the gaps: fact-dense service and FAQ pages with prices, areas and credentials, structured data, consistent listings, and mentions on the sites those answers draw from. Online stores add complete product data for AI shopping assistants.","why":"AI Overviews appear on about 48% of Google searches, and a top-ranked page gets about 58% fewer clicks when one shows. Fewer than half of Google's local leaders appear in AI answers, which leaves an opening for small businesses that move early. Measurement is still young, so treat this as emerging.","sources":[{"t":"Superlines: AI search statistics (2026)","u":"https://www.superlines.io/articles/ai-search-statistics/"},{"t":"BrightLocal: local SEO statistics (2026)","u":"https://brightlocal.com/research/local-seo-statistics/"},{"t":"Whitespark: local search ranking factors (2026)","u":"https://whitespark.ca/local-search-ranking-factors/"}],"steps":["List 30 questions buyers ask before choosing a business like yours.","Ask them in ChatGPT, Perplexity, Gemini and AI Mode, and record who's named and what's said about you.","Fix the facts first: listings, service pages, prices, areas, credentials.","Earn mentions in the lists and directories those answers cite.","Re-run the same questions monthly and track the change."],"tools":["ChatGPT, Perplexity, Gemini","Google Search Console","Peec AI or Semrush AI toolkit","Schema.org structured data"],"time":"2–3 weeks, then monthly","cost":"A$0–200 a month","risks":["Quick tricks such as llms.txt files show no lift. Spend the effort on facts and reputation."],"after":["mkt-reviews"],"emberseed":"A Sprint build: the question panel, the fixes, and a monthly check that runs on a schedule, the way EmberSeed's news site runs."},{"id":"mkt-video","name":"Explainer videos, no studio","stage":"connected","branch":"marketing","summary":"Short explainer and how-to videos made from your scripts with motion graphics and a labelled AI voice.","what":"AI drafts the script from your SOPs or service pages, and you approve it. The video is built from motion graphics, screen recordings and an AI narrator (or an avatar), captioned, and labelled as AI-narrated. It suits how-tos, onboarding, service explainers and social clips.","why":"Video explains a process better than text, but filming is slow and costly. Small studies find people learn as well from synthetic presenters, though trust drops if it isn't disclosed, which is why the label matters. The Australian Government's guidance on labelling AI content is voluntary but clear.","sources":[{"t":"Department of Industry: Being clear about AI-generated content (Nov 2025)","u":"https://www.industry.gov.au/publications/being-clear-about-ai-generated-content"},{"t":"Philippa Hardman: synthetic educators","u":"https://drphilippahardman.substack.com/p/your-synthetic-educator-looks-perfect"}],"steps":["Pick five questions customers or new staff ask that a 60-second video would answer.","Have AI draft each script from your existing pages, then edit it for accuracy.","Build each video with motion graphics or screen capture and an AI voice.","Caption it and label it 'Narrated by an AI voice'.","Count views and repeat questions, then make the next five."],"tools":["Descript or CapCut","HeyGen or Synthesia","ElevenLabs","Canva"],"time":"1–2 weeks for the first five","cost":"A$30–250 a month","risks":["Never clone a person's voice or face without written consent.","Undisclosed AI presenters erode trust when people notice."],"after":["mkt-voice"],"emberseed":"A Sprint build: EmberSeed makes narrated explainers in its own studio, and you approve every script before anything is made."},{"id":"mkt-ads","name":"Ads that learn, with limits","stage":"connected","branch":"marketing","summary":"Google and Meta's AI campaigns, with conversion tracking and guardrails so spend chases customers, not clicks.","what":"Fix conversion tracking first, so the ad platforms learn from real enquiries and sales, including offline ones from your CRM. Then use Google's AI Max and Meta's Advantage+ with brand rules, landing-page controls and negative keywords, and review the search terms weekly.","why":"Google claims 7–27% more conversions from its AI campaigns, but an independent study of 250+ retail campaigns found median revenue up 13% and cost per acquisition up 16%, with returns ranging from −35% to +42%. The AI works for you only when it's measuring the right thing.","sources":[{"t":"Adtrak: Google Ads AI Max in 2026","u":"https://www.adtrak.co.uk/blog/google-ads-ai-max-in-2026-what-it-is-why-it-matters-and-what-to-do-before-septemb"},{"t":"Search Engine Journal: Meta automation for small business","u":"https://www.searchenginejournal.com/meta-brings-automation-to-small-business-advertising/"}],"steps":["Set up conversion tracking for enquiries and sales, including from your CRM.","Start with a small, capped budget and a target cost per lead.","Turn on AI campaigns with brand rules, page controls and negatives.","Review search terms and placements weekly, and add negatives.","Compare the cost per real customer with your baseline each month."],"tools":["Google Ads (AI Max)","Meta Advantage+","Google Analytics 4","HubSpot or Pipedrive offline conversions"],"time":"1–2 weeks, then weekly reviews","cost":"Your ad budget, plus 1–2 hours a week","risks":["Automated campaigns can spend fast on the wrong searches. Cap the budget and check weekly."],"after":["mkt-ai-search","baseline"],"emberseed":"A Sprint build. EmberSeed runs its own Google Ads with a daily cap, tracked through Google Analytics."},{"id":"mkt-engine","name":"An always-on content engine","stage":"deep","branch":"marketing","summary":"Topics from sales calls, FAQs and news become drafts, fact-checked, approved by a person, then scheduled.","what":"A scheduled pipeline gathers raw material (questions customers asked, jobs completed, industry news), drafts posts and newsletters in your voice, checks every claim against its sources and sends each draft for a person to approve. Approved pieces are scheduled, and a monthly digest reports what worked.","why":"Content calendars slip because nobody owns distribution. A pipeline with a built-in fact-check and an approval step keeps the rhythm without letting errors through. EmberSeed's AI News is made this way every night: one model picks stories, another writes them, a third checks them against the sources.","sources":[{"t":"EmberSeed AI News (made by a nightly pipeline)","u":"https://andrewgardneremberseed.github.io/emberseed-news/"}],"steps":["Decide the rhythm: what goes out, where and how often.","Connect the raw material: CRM notes, FAQs, a news feed.","Write the voice, the fact-check rules and the approval step.","Run it for a month with every piece approved by hand.","Report monthly on what was published, what it earned and what was rejected."],"tools":["HubSpot Breeze agents","Canva scheduled tasks","Claude or n8n pipelines","GitHub Actions","Buffer or Meta Business Suite"],"time":"4–8 weeks","cost":"A$20–150 a month in AI and tools","risks":["Volume isn't value. Publish less, better, and measure enquiries rather than posts.","Never let the pipeline post without a person's approval."],"after":["mkt-voice","agents","check-ai"],"emberseed":"A Fractional AI Lead build. EmberSeed's own AI News comes out of one every night."},{"id":"sales-quotes","name":"Quotes and proposals, fast","stage":"quick","branch":"sales","summary":"First drafts of quotes and proposals in minutes, from your rate card, your terms and your past winning proposals.","what":"A saved project holds your rate card, terms, standard inclusions and three of your best proposals. Give it the enquiry and your notes, and it drafts the quote or proposal in your format for you to check and send. Trades businesses can use the quoting AI in ServiceM8 or Tradify.","why":"The business that quotes first often wins the job. Quote preparation is one of the most-cited low-risk first projects, because the inputs are already written down and a person still signs off the price.","sources":[{"t":"Databrain: the best first AI automation project for an SME","u":"https://databrain.solutions/insights/the-best-first-ai-automation-project-for-an-sme"},{"t":"ServiceM8: AI job management for trades","u":"https://www.servicem8.com/ai-job-management-software-for-trade-contractors"}],"steps":["Gather your rate card, terms and three winning proposals.","Build the quoting helper with your format and rules: minimums, exclusions, validity.","Test it on five past enquiries and compare with what you actually sent.","Use it on new work, with a person checking every price.","Track time to quote and win rate against your baseline."],"tools":["Claude or ChatGPT Projects","Qwilr or PandaDoc","ServiceM8 Auto-Quote","Tradify"],"time":"2–5 days","cost":"Included in business AI plans","risks":["A wrong price is a binding offer. A person checks every number before it's sent."],"after":["platform","helpers"],"emberseed":"A classic AI Quick Win: a quoting helper built on your real proposals, live in a week."},{"id":"sales-research","name":"Know the prospect first","stage":"quick","branch":"sales","summary":"A one-page brief on any prospect before the call: what they do, recent news, likely needs and good questions.","what":"Before a meeting, AI research reads the prospect's website, news, job ads and public records, and writes a one-page brief: what they do, what's changed lately, what they probably need from you, and five questions worth asking. You open the sources it cites before relying on them.","why":"Preparation turns a pitch into a conversation, and it's the first thing to go when you're busy. Deep-research modes in ChatGPT, Claude and Gemini do in minutes what used to take an hour, and they cite their sources so you can check them.","sources":[],"steps":["Write a brief template: business, people, recent changes, likely needs, questions.","Save it as a helper that uses deep research.","Run it the day before every first meeting.","Open two of its sources to check it.","Attach the brief to the meeting in your CRM."],"tools":["ChatGPT deep research","Claude Research","Gemini Deep Research","Perplexity"],"time":"1 day","cost":"Included in business AI plans","risks":["Research tools can misread or invent sources. Check anything you'll repeat to the client."],"after":["helpers"],"emberseed":"Usually part of a Team AI Workshop or an AI Quick Win."},{"id":"sales-leads","name":"Answer every lead fast","stage":"connected","branch":"sales","summary":"Web forms, emails and missed calls answered in minutes with a tailored reply and a booking link, then logged.","what":"When an enquiry arrives (a web form, an email, a missed call), an automation sorts it, looks up what it can, drafts a reply tailored to what was asked with a booking link, and creates the deal in your CRM. You approve replies at first; routine ones can go automatically once you trust them.","why":"Enquiries that wait hours go cold or go elsewhere, and speed of reply is one of the most dependable levers in small-business sales. Every piece (forms, automation tools, AI drafting, the CRM) is off the shelf.","sources":[],"steps":["Send every enquiry channel to one place.","Write the reply rules: what to say to each kind of enquiry, and when a person steps in.","Build the flow: sort, look up, draft, book, log.","Approve every reply for two weeks, then let the routine ones go.","Track time to first reply and the share that book a call."],"tools":["Zapier, Make or n8n","HubSpot or Pipedrive","Calendly or Google appointment schedules","SMS for missed calls"],"time":"1–2 weeks","cost":"A$30–100 a month","risks":["A wrong automatic reply is worse than a slow one. Start with approval, and keep a path to a person in every reply."],"after":["connect","sales-quotes"],"emberseed":"One of the builds in an AI Launch Sprint."},{"id":"sales-crm","name":"A CRM that fills itself","stage":"connected","branch":"sales","summary":"Calls, emails and meetings update the CRM by themselves, with a next step suggested for every deal.","what":"Meeting notes, emails and call summaries flow to the right contact and deal automatically. AI fills the fields, suggests the next step and flags deals that have gone quiet, so the CRM stays current without data entry and the pipeline report means something.","why":"Most small-business CRMs are out of date because updating them is a chore. Pipedrive and HubSpot now build this in (thread summaries, email writers, next-step suggestions), so it's mostly configuration rather than building.","sources":[{"t":"Pipedrive: AI features by plan (Sep 2026)","u":"https://support.pipedrive.com/en/article/pipedrive-ai"},{"t":"Resolve247: HubSpot Breeze pricing change","u":"https://resolve247.ai/blog/hubspot-breeze-pricing-change"}],"steps":["Clean the CRM first: merge duplicates and agree the stages.","Connect email and meeting notes to it.","Turn on summaries and next-step suggestions.","Review stale deals weekly from the AI's list.","Check a sample of auto-filled records each fortnight."],"tools":["HubSpot (Breeze)","Pipedrive AI","Fathom or Fireflies","monday.com CRM"],"time":"1–3 weeks","cost":"Often in your CRM plan; add-ons about US$15–50 per user a month","risks":["Recording calls needs consent. Say so at the start of every recorded call."],"after":["meetings","connect","data-ready"],"emberseed":"A Sprint build. EmberSeed's own leads live on a monday.com board that feeds the screen on Andrew's desk."},{"id":"sales-coach","name":"A coach for every deal","stage":"deep","branch":"sales","summary":"A weekly agent reviews the pipeline, flags stalled deals, drafts the next move and updates the forecast.","what":"Every Monday an agent reads the CRM, recent emails and meeting notes, then reports which deals are stalling and why, drafts a next step for each (a follow-up, a question, a revised proposal) and updates the forecast with its reasoning. Salespeople decide and send; nothing reaches a customer automatically.","why":"Fully autonomous AI salespeople have mostly disappointed, and Gartner warns that many products sold as agents are 'agent washing'. An agent that researches and drafts while people decide gets the benefit without the brand and spam risk.","sources":[{"t":"Outlook Business: Gartner on agentic AI projects (2025)","u":"https://www.outlookbusiness.com/artificial-intelligence/over-40-of-agentic-ai-projects-will-be-scrapped-by-2027-says-gartner"}],"steps":["Make sure the CRM is current (see A CRM that fills itself).","Define what 'stalled' means in your sales cycle.","Build the weekly review: read, flag, draft, forecast.","Have each salesperson rate the drafts for a month.","Compare forecast accuracy and win rates with your baseline."],"tools":["HubSpot Breeze agents","Pipedrive Sales Assistant","Claude or Copilot agents","n8n"],"time":"4–8 weeks","cost":"A$20–100 a month in AI usage","risks":["Don't let AI send cold outreach unsupervised: the Spam Act applies, and so does your reputation."],"after":["sales-crm","agents","check-ai"],"emberseed":"A Fractional AI Lead build, with your sales team rating it as it learns."},{"id":"care-replies","name":"Faster, kinder replies","stage":"quick","branch":"care","summary":"AI drafts replies to customer emails and tickets from your policies and past answers; your team checks and sends.","what":"In your shared inbox or help desk, AI suggests a reply to each message using your policies, your best past answers and the customer's history, and summarises long threads. Your team edits and sends, so answers get faster and more consistent without losing the human touch.","why":"In a field study of 5,179 support agents, those with AI help resolved 14% more issues an hour, and newer staff 34% more. Most help desks and email tools already include the feature.","sources":[{"t":"NBER: Generative AI at Work (Brynjolfsson, Li and Raymond)","u":"https://www.nber.org/papers/w31161"}],"steps":["Collect your policies and twenty of your best past replies.","Turn on suggested replies in your help desk or email tool, pointed at them.","Agree what must never be promised without a manager.","Have staff rate the drafts for two weeks, and fix the sources behind bad ones.","Track first-response time and how often tickets reopen."],"tools":["Gemini in Gmail","Copilot in Outlook","Zendesk, Freshdesk or Gorgias AI","HubSpot help desk","ServiceM8 reply suggestions"],"time":"1–3 days","cost":"Often included; help-desk AI about US$20–50 per agent a month","risks":["AI can promise what your policy doesn't allow. Keep refunds and exceptions with a person."],"after":["platform"],"emberseed":"An AI Quick Win, live in a week in the inbox or help desk you already use."},{"id":"care-calls","name":"Every call answered","stage":"quick","branch":"care","summary":"An AI receptionist answers when you can't: takes details, books jobs, texts a link and passes on the urgent ones.","what":"When the team is busy or after hours, an AI voice agent answers in an Australian voice, says it's an AI, takes the caller's details and need, books a time or texts a booking link, and transfers or flags anything urgent. Every call arrives as a written summary.","why":"Trades and clinics lose jobs to missed calls while they're working. AI receptionists are proven for after-hours and overflow calls, messages and simple bookings, and Australian services start at about A$60 to A$300 a month.","sources":[{"t":"RingCentral: AI receptionist launches in Australia (Nov 2025)","u":"https://www.ringcentral.com/au/en/whyringcentral/company/pressreleases/ringCentral-transforms-customer-communications-with-launch-of-ai-receptionist-in-australia.html"},{"t":"Forbes Australia: an AI receptionist for Aussie tradies","u":"https://www.forbes.com.au/news/innovation/this-ex-google-duo-just-raised-900k-to-build-an-ai-receptionist-for-aussie-tradies/"}],"steps":["Count your missed calls for two weeks.","Write what the agent may and may not say: prices, promises, emergencies.","Set it up to say it's an AI, take details, and book or text a link.","Make 50 test calls, including awkward ones.","Read the call summaries weekly and refine."],"tools":["ServiceM8 Phone Agent","RingCentral AI Receptionist","Sophiie","Retell or Vapi for custom builds"],"time":"2–7 days","cost":"About A$60–500 a month","risks":["In South Australia, recording a call needs every party's consent, so say so up front.","Never let it quote prices or promise times it can't keep."],"after":["policy"],"emberseed":"An AI Quick Win for trades and clinics: set up, tested with 50 calls and handed over within a week."},{"id":"care-kb","name":"Answers from your knowledge","stage":"connected","branch":"care","summary":"A chat and email assistant that answers common questions from your own help articles, and hands over to a person.","what":"An AI assistant on your website and inbox answers the questions you get every week, using only your approved help articles and policies. It says it's an AI, and passes anything it can't answer (or anyone who asks) to a person with the conversation attached. Unanswered questions become new articles.","why":"Most small businesses answer the same 30 questions over and over. Help-desk agents resolve between a quarter and over half of conversations in published cases (vendor figures), but only with curated knowledge behind them. Klarna reversed its AI-first service after quality fell, and now says customers must always be able to reach a person.","sources":[{"t":"eesel: Gorgias AI review (vendor cases)","u":"https://www.eesel.ai/blog/gorgias-ai-review"},{"t":"Tech.co: Klarna reverses its AI overhaul","u":"https://tech.co/news/klarna-reverses-ai-overhaul"}],"steps":["Write or refresh help articles for your top 30 questions.","Connect the assistant to those articles only.","Label it as AI, and give every conversation a way to a person.","Review unanswered and handed-over questions weekly, and write the missing articles.","Track the resolution rate and customer satisfaction."],"tools":["HubSpot Customer Agent","Intercom Fin","Gorgias AI Agent","Zendesk AI","Tidio"],"time":"2–4 weeks","cost":"About US$0.50–1 per resolved conversation","risks":["Wrong answers can mislead customers under the Australian Consumer Law. Ground it in approved content and read the logs."],"after":["care-replies","brain-grows"],"emberseed":"A Sprint build, including the help articles it needs."},{"id":"care-themes","name":"What customers keep saying","stage":"connected","branch":"care","summary":"Reviews, complaints and tickets read every month and turned into the top themes, quotes and fixes.","what":"Each month, AI reads that month's reviews, complaints, survey comments and support tickets, groups them into themes, counts them, and pulls out representative quotes and suggested fixes for the owner. It's the voice of the customer without a research team.","why":"Complaints and reviews hold the most honest feedback a business gets, and almost nobody reads them together. A monthly theme report turns them into a short list of fixes, and lets you tell customers what you changed.","sources":[{"t":"Dovetail (Australian customer-insight platform)","u":"https://dovetail.com/"}],"steps":["Export a month of reviews, tickets and survey comments.","Remove names and contact details first.","Have AI theme, count and quote them.","Pick one fix a month, and tell customers you made it.","Watch that theme's count fall."],"tools":["Claude or ChatGPT on exports","Dovetail","Your help desk's reports"],"time":"1–2 days a month, or a week to automate","cost":"A$0–100 a month","risks":["Exports carry personal information. Strip it before analysis."],"after":["care-replies"],"emberseed":"Part of a Sprint, or a monthly report under Fractional AI Lead."},{"id":"care-churn","name":"Spot churn before it happens","stage":"deep","branch":"care","summary":"Signals from tickets, payments and orders combined into a health score, with a save plan drafted for each at-risk customer.","what":"An agent combines what your systems already know (late payments, complaints, falling orders or usage, an account gone quiet) into a simple health score for each customer, flags who's at risk and why, and drafts a save plan: a call, a fix, an offer. The account owner decides what to do.","why":"Keeping a customer costs far less than finding a new one, yet mos
