t small businesses learn a customer was unhappy when they leave. Health scores are standard practice in software companies, and the same signals exist in any business that keeps records.","sources":[],"steps":["List the signals you already have: payments, complaints, order frequency, contact.","Agree a simple score with whoever looks after the accounts.","Have an agent calculate it weekly and explain each red flag.","Review the at-risk list in a weekly meeting, and act on it.","Measure retention against last year."],"tools":["Your CRM and accounting data","HubSpot customer success tools","Claude or n8n agents","Looker Studio or Power BI"],"time":"4–8 weeks","cost":"A$20–150 a month","risks":["A score is a reason for a conversation, not a verdict. Don't automate offers or penalties from it."],"after":["care-themes","sales-crm","agents"],"emberseed":"A Fractional AI Lead build, from someone who has led customer success and retention teams for years."},{"id":"care-actions","name":"Resolutions with limits","stage":"deep","branch":"care","summary":"AI that can also fix things (rebook, refund small amounts, update orders) within set limits, with a log.","what":"Beyond answering, the assistant takes a few defined actions through your systems: rebooking an appointment, updating an address, refunding up to a set amount, sending a replacement part. Each action has limits, every action is logged, and anything outside the rules goes to a person.","why":"Customers want problems fixed, not explained. The safe pattern is small, reversible actions with dollar limits and a human path, because a fully autonomous service is where quality and trust have broken down.","sources":[{"t":"Tech.co: Klarna reverses its AI overhaul","u":"https://tech.co/news/klarna-reverses-ai-overhaul"}],"steps":["Choose two or three actions that are small and reversible.","Set limits: dollar caps, how often, which customers.","Build each action with a log and an undo.","Run it with a person approving for a month.","Review every exception weekly."],"tools":["Intercom Fin Procedures","Gorgias Actions","Custom Claude agents on Shopify, ServiceM8 or Xero"],"time":"1–3 months","cost":"Per-resolution fees, plus build time","risks":["An agent with authority can be talked into things. Keep caps low, log everything, and never remove the path to a person."],"after":["care-kb","check-ai","security"],"emberseed":"A Fractional AI Lead build, staged from approval-only to limited authority."},{"id":"fin-reconcile","name":"Reconciliation on autopilot","stage":"quick","branch":"finance","summary":"Bank lines matched automatically, each match explained, and only the exceptions left for a person.","what":"Your accounting system's AI matches bank transactions to invoices, bills and rules, explains why it matched each one, and leaves only the odd ones for your bookkeeper. The exceptions shrink as it learns your patterns.","why":"Xero says its automatic reconciliation saves about half of monthly reconciliation time and has matched over 100 million transactions (vendor figures), and MYOB has a similar feature in beta. It's a common first finance project because it's configuration, not building.","sources":[{"t":"Xero: new AI innovations at Xerocon (Aug 2026)","u":"https://www.xero.com/au/media-releases/new-ai-innovations-xerocon-denver/"},{"t":"IT Brief: MYOB launches AI tools for BAS and invoicing (Mar 2026)","u":"https://itbrief.com.au/story/myob-launches-ai-tools-for-bas-insights-invoicing"}],"steps":["Put every bank account on a live feed.","Turn on automatic reconciliation and bank rules.","Review the AI's matches daily for a fortnight.","Fix recurring exceptions with rules.","Keep a person reviewing exceptions before each BAS."],"tools":["Xero JAX","MYOB Smart Reconciliation","Your bookkeeper"],"time":"1–2 days","cost":"Included in most plans (in Xero, Grow and above)","risks":["Automatic doesn't mean unchecked. Review the exceptions, and a sample of matches, each month."],"after":["paperwork"],"emberseed":"Often set up alongside Invoices and receipts on autopilot, with your bookkeeper."},{"id":"fin-debtors","name":"Get paid sooner","stage":"quick","branch":"finance","summary":"Reminders timed and worded for each customer's payment habits, with a polite path to a phone call.","what":"Your accounting system sends reminders before and after due dates, worded and timed for each customer's history: a gentle nudge for the usual late payer, a firmer note when it's overdue, and a task for you to call when it matters. Payment links make paying the easy option.","why":"Late payment squeezes cash: 24% of SMEs with employees told MYOB that late payments put significant pressure on the business. Xero and MYOB are both rolling out AI reminders that adapt to each customer.","sources":[{"t":"IT Brief: MYOB launches AI tools for BAS and invoicing (Mar 2026)","u":"https://itbrief.com.au/story/myob-launches-ai-tools-for-bas-insights-invoicing"},{"t":"Xero: the agentic era for small business finance (Xerocon 2026)","u":"https://blog.xero.com/us/product-updates/xerocon-london-2026-agentic-era-small-business-finance/"}],"steps":["Turn on online payment links on every invoice.","Set reminders for before, on and after the due date.","Write three tones, and pick one per customer.","Get a weekly list of who to call, not just who to email.","Track how many days it takes to get paid, against your baseline."],"tools":["Xero invoice reminders and JAX","MYOB Smart Invoice Reminders","Stripe or your payment provider"],"time":"1–3 days","cost":"Included, plus payment fees","risks":["Automated chasing of a customer in hardship can do harm. A person decides escalations."],"after":["paperwork"],"emberseed":"An AI Quick Win, often paired with the invoicing side of Invoices and receipts on autopilot."},{"id":"fin-billcheck","name":"Stop fake and duplicate bills","stage":"connected","branch":"finance","summary":"Every bill checked against the supplier's history for odd amounts, duplicates and changed bank details before approval.","what":"Before a bill is approved, AI compares it with that supplier's past bills and your purchase orders and flags anything odd: a new bank account, an unusual amount, a duplicate, an unknown supplier. It never approves or pays; a person does, and a changed bank account always gets a phone call.","why":"Payment-redirection scams cost Australians A$166.8 million in 2025, and small businesses lost A$9.5 million across 2,228 scam reports. CommBank found only 55% of small businesses had checked supplier payment details in the previous six months.","sources":[{"t":"iTWire: Scams Awareness Week 2026","u":"https://itwire.com/business-it-news/security/scams-awareness-week-what-australians-need-to-know-in-2026"},{"t":"CommBank: can Australians spot deepfake scams? (Jan 2026)","u":"https://commbank.com.au/articles/newsroom/2026/01/can-australians-spot-deepfake-scams.html"},{"t":"IT Brief: ApprovalMax AI bill checks for Xero (Oct 2026)","u":"https://itbrief.co.uk/story/approvalmax-launches-ai-bill-checks-for-xero-users"}],"steps":["Set an approval rule: who approves what, by amount.","Turn on bill checks in your approval or accounting tool.","Add the rule that any bank-detail change means a call to a number you already hold.","Review flagged bills daily.","Run a scam drill with whoever pays the bills."],"tools":["ApprovalMax Approval Agent","Xero Bill Protection (beta)","Lightyear","Your bank's payee checks"],"time":"2–5 days","cost":"About A$30–100 a month","risks":["Fraud is stopped by process, not AI. The call-back rule is the control; the AI points at what to check."],"after":["paperwork","security"],"emberseed":"A Sprint build, set up with your bookkeeper."},{"id":"fin-cash","name":"Cash forecast with what-ifs","stage":"connected","branch":"finance","summary":"A rolling 13-week cash forecast you can question: what if we hire, buy the ute, or a big client pays late?","what":"A forecasting tool on your Xero or MYOB data projects cash week by week, and an AI connected to it answers what-if questions in plain English: what happens if we hire in March, delay this bill or lose that client. It flags tight weeks around BAS, payroll and super.","why":"Many small businesses steer by the bank balance and get surprised at BAS, payroll and super time, and Payday Super (from 1 July 2026) puts super on the same day as wages. Most forecasting 'AI' is really predicting when customers pay, so start with the built-in projections and add AI for the questions.","sources":[{"t":"Xero App Store: cash-flow apps","u":"https://apps.xero.com/au/collection/cashflow"},{"t":"Hall & Wilcox: Payday Super starts 1 July 2026","u":"https://hallandwilcox.com.au/news/payday-super-starts-1-july-2026-what-employers-need-to-do-now/"}],"steps":["Connect a forecasting tool to your accounting data.","Add the known future: payroll, super, BAS, loans, big orders.","Review the forecast weekly for a month, and correct its assumptions.","Connect your AI so you can ask what-if questions.","Set an alert for any week below your cash floor."],"tools":["Float, Fathom or Calxa","Xero Cash Flow Actions (beta)","Xero or MYOB connectors in Claude, ChatGPT or Copilot"],"time":"1–2 weeks","cost":"About A$40–150 a month","risks":["A forecast is only as good as its assumptions. Review them rather than just reading the chart."],"after":["fin-reconcile","connect"],"emberseed":"A Sprint build, done with your accountant."},{"id":"fin-bas","name":"BAS without the scramble","stage":"connected","branch":"finance","summary":"Transactions reviewed all quarter, GST oddities flagged early, and a pre-filled BAS ready for your agent to sign.","what":"Instead of a quarterly scramble, AI reviews transactions as they come in, flags likely GST coding errors and unusual items, and keeps a running list of questions for your bookkeeper. At the end of the quarter the BAS is pre-filled for your registered BAS or tax agent to review and lodge.","why":"GST coding errors build up quietly over a quarter. MYOB has an AI BAS assistant in beta that reviews transactions and pre-fills the report for the agent to sign off. Liability stays with the business and its agent.","sources":[{"t":"IT Brief: MYOB launches AI tools for BAS and invoicing (Mar 2026)","u":"https://itbrief.com.au/story/myob-launches-ai-tools-for-bas-insights-invoicing"}],"steps":["Agree with your agent what they need and when.","Turn on anomaly flags in your accounting system.","Clear flagged items weekly, not quarterly.","Have AI prepare the quarter's summary and questions.","Your agent reviews, signs and lodges."],"tools":["MYOB AI BAS (beta)","Xero Partner Hub flags","Your BAS or tax agent"],"time":"1–2 weeks to set up","cost":"Mostly included","risks":["AI doesn't replace your registered agent. They sign the BAS, and the business stays responsible."],"after":["fin-reconcile"],"emberseed":"Set up in a Sprint alongside your bookkeeper. EmberSeed doesn't give tax advice."},{"id":"fin-close","name":"A month-end close agent","stage":"deep","branch":"finance","summary":"An agent checks reconciliations, prepares routine journals and drafts the month's commentary, for approval.","what":"At month-end an agent checks that every account is reconciled, prepares routine journals (prepayments, accruals, depreciation) with its workings, drafts the management commentary and lists what needs a human decision. Nothing posts until your bookkeeper or accountant approves it.","why":"Month-end is where finance agents are arriving first, because the work is checkable. Xero's month-end agent is in early access and its Claude connector is used daily by thousands, and MYOB began linking to Claude and ChatGPT in August 2026.","sources":[{"t":"Xero: new AI innovations at Xerocon (Aug 2026)","u":"https://www.xero.com/au/media-releases/new-ai-innovations-xerocon-denver/"},{"t":"IT Brief: MYOB links small business data to Claude and ChatGPT (Aug 2026)","u":"https://itbrief.com.au/story/myob-links-small-business-data-to-claude-chatgpt"}],"steps":["Write down your month-end checklist as it is today.","Connect your AI to the ledger read-only, and have it run the checks.","Add journal preparation with workings, approved by a person.","Draft the commentary from the final numbers.","Compare close time and corrections with your baseline."],"tools":["Xero JAX and month-end agent (early access)","Xero and MYOB connectors in Claude or ChatGPT","Fathom commentary","n8n"],"time":"1–3 months","cost":"A$20–150 a month","risks":["Write access to the ledger is serious. Keep it read-only until approvals and logs are proven."],"after":["fin-reconcile","reports","check-ai"],"emberseed":"A Fractional AI Lead build, with your accountant approving every journal."},{"id":"hr-docs","name":"HR documents in minutes","stage":"quick","branch":"people","summary":"Job ads, position descriptions, letters, policies and review prep drafted from your templates and the right award.","what":"A saved project holds your templates, values, and the modern awards and policies that apply to you. It drafts the job ad, position description, offer letter, policy update or performance-review notes, for a manager (and, where contentious, an adviser) to check and sign.","why":"Admin is one of the top uses of AI in Australian small businesses (36% in a 2026 survey of 3,790). HR paperwork is repetitive and template-driven, which suits drafting, with a person always signing.","sources":[{"t":"QuickBooks: AI Impact Report Australia (May 2026)","u":"https://quickbooks.intuit.com/au/blog/news/ai-impact-report-australia-2026/"}],"steps":["Collect your templates and the awards that apply.","Build the HR project with them and your values.","Draft your next three documents with it and compare.","Send anything contentious (warnings, terminations) to an adviser.","Keep a library of approved outputs."],"tools":["Claude, ChatGPT or Copilot","Employment Hero AI","Fair Work Ombudsman templates"],"time":"1–2 days","cost":"Included in business AI plans","risks":["Don't let AI rank or reject job candidates: it can discriminate, and from 10 December 2026 you may have to disclose it.","Keep employees' personal information out of tools you haven't approved."],"after":["platform","policy"],"emberseed":"Usually part of a Team AI Workshop or an AI Quick Win."},{"id":"hr-helper","name":"Answers to staff questions","stage":"quick","branch":"people","summary":"An assistant that answers leave, pay and policy questions from your approved documents, and cites the page.","what":"Staff ask a chat assistant how leave works, what the expenses rule is or where the uniform policy lives. It answers only from your approved policies and the right award, quotes the source, and passes anything personal or sensitive to a manager.","why":"Managers spend hours answering the same policy questions. The government-funded AI Adopt Centre at ARM Hub, after working with more than 300 SMEs, found AI pays off where it cuts search time and reliance on key people, which is exactly this.","sources":[{"t":"IT Brief: ARM Hub maps a practical AI path for Australian factories","u":"https://itbrief.com.au/story/arm-hub-maps-practical-ai-path-for-australian-factories"}],"steps":["Gather the current policies, and retire old versions.","Build the assistant on those documents only.","Make it cite the policy and page in every answer.","Route anything personal or sensitive to a manager.","Name an owner to update the policies and the assistant together."],"tools":["NotebookLM","Gemini Gems","Copilot agent on SharePoint","Employment Hero AI assistant"],"time":"2–5 days","cost":"Included in business AI plans","risks":["A stale policy gives a confident wrong answer. Update the source, not just the bot."],"after":["data-ready","hr-docs"],"emberseed":"An AI Quick Win, built on your approved policies."},{"id":"hr-onboard","name":"Onboarding that runs itself","stage":"connected","branch":"people","summary":"New starters get accounts, paperwork, training and check-ins on schedule, without a manager chasing each step.","what":"When a hire is confirmed, a workflow sets up accounts, sends contracts and forms, books first-week training, assigns short videos and quizzes built from your SOPs, and schedules check-ins at day one, week one and month one. The manager sees progress on one page.","why":"Onboarding is mostly repeatable admin that gets squeezed when the business is busy, and the new starter feels it. HR platforms and automation tools now cover the steps, and AI turns your own procedures into the training.","sources":[],"steps":["Write the onboarding checklist as it really is.","Automate the accounts, documents and bookings.","Turn your SOPs into short training with quizzes.","Schedule the check-ins and a 30-day survey.","Review each new starter's experience and fix the gaps."],"tools":["Employment Hero onboarding","Zapier or Make","Microsoft 365 or Google Workspace admin","Scribe, Trainual or Loom"],"time":"1–3 weeks","cost":"A$0–100 a month","risks":["Automate the admin, not the welcome. Keep a person meeting the new starter."],"after":["ops-sops","connect"],"emberseed":"A Sprint build."},{"id":"hr-payroll","name":"Pay runs checked first","stage":"connected","branch":"people","summary":"Every pay run checked against rosters and awards for anomalies before it goes, with super paid on payday.","what":"Before each pay run, AI compares hours, rates and allowances with rosters, timesheets and the award, and flags outliers (an overtime spike, a missing penalty rate, a duplicate) for a person to check. Since 1 July 2026 super must reach funds within seven business days of payday, so pay and super go together.","why":"Pay errors cost money, trust and penalties, and Payday Super tightened the timing. Payroll platforms used by Australian SMEs now flag anomalies for a person to approve before the run.","sources":[{"t":"Hall & Wilcox: Payday Super starts 1 July 2026","u":"https://hallandwilcox.com.au/news/payday-super-starts-1-july-2026-what-employers-need-to-do-now/"}],"steps":["Connect rosters and timesheets to payroll.","Turn on anomaly checks in your payroll platform.","Review the flags before every run.","Pay super with each pay run.","Have your payroll adviser check award interpretation once a year."],"tools":["Employment Hero (HeroAI)","Deputy","Xero or MYOB payroll (Single Touch Payroll)"],"time":"1–2 weeks","cost":"Mostly included in your payroll plan","risks":["AI doesn't interpret awards for you. Your payroll adviser does."],"after":["hr-docs"],"emberseed":"Set up in a Sprint with your payroll provider. EmberSeed doesn't give payroll or legal advice."},{"id":"hr-training","name":"Training built from your SOPs","stage":"deep","branch":"people","summary":"Each role's training assembled from your procedures and refreshed when they change, with quizzes and sign-off.","what":"Your SOPs and second brain become training paths for each role: short lessons, AI-narrated videos and quizzes, rebuilt automatically when a procedure changes. Managers see who has completed what, and refreshers are suggested where mistakes cluster.","why":"Training goes stale the day a process changes. Generating it from the same source as your procedures keeps the two in step, and turns your second brain into the thing that teaches new people.","sources":[],"steps":["Get your SOPs into the second brain, with owners and review dates.","Map which procedures each role needs.","Generate the lessons, videos and quizzes for each role, and have a manager approve them.","Rebuild them when an SOP changes.","Link refreshers to the mistakes you actually see."],"tools":["Your second brain","Trainual or a learning platform","HeyGen or Synthesia","Claude or Gemini"],"time":"1–3 months","cost":"A$30–250 a month","risks":["Monitoring staff with AI has legal limits. Consult staff and stay within workplace surveillance law."],"after":["hr-onboard","brain-grows","mkt-video"],"emberseed":"A Fractional AI Lead build, drawing on EmberSeed's video studio and second-brain work."},{"id":"brain-grows","name":"A company brain everyone uses","stage":"connected","branch":"core","summary":"The first-win wiki grown into the business's knowledge base: permissions, nightly updates and cited answers in Teams or Slack.","what":"The second brain grows up. It pulls new material nightly from shared drives, the CRM and email, keeps HR and finance pages behind permissions, and answers staff questions in Teams or Slack with a link to its source. Every page has an owner, and stale or contradictory pages are flagged each month.","why":"Searching for information is one of the biggest hidden costs in a business. The government-funded AI Adopt Centre at ARM Hub found AI pays off for SMEs where it cuts search time and reliance on key people, and fails where it produces summaries with no link to action. Karpathy's pattern scales by adding search once the wiki passes about 100 sources.","sources":[{"t":"IT Brief: ARM Hub maps a practical AI path for Australian factories","u":"https://itbrief.com.au/story/arm-hub-maps-practical-ai-path-for-australian-factories"},{"t":"Andrej Karpathy: LLM wiki (2026)","u":"https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f"}],"steps":["Start from the first-win wiki and its rules file.","Add nightly updates from the drives and systems people use.","Set permission tiers for HR, finance and client-confidential pages.","Put the questions where people work, with a source required for every answer.","Run a monthly check for stale and contradictory pages."],"tools":["Claude Projects or Cowork","NotebookLM","Copilot agent on SharePoint","Notion AI or Guru"],"time":"2–6 weeks","cost":"A$0–100 a month","risks":["Flattened permissions leak sensitive pages. Set the tiers before you connect anything."],"after":["second-brain","data-ready","connect"],"emberseed":"A Sprint build. EmberSeed's own brain runs on this pattern."},{"id":"ops-inbox","name":"An inbox that sorts itself","stage":"quick","branch":"ops","summary":"Email sorted by what needs you, routine replies drafted, and meetings booked without the back-and-forth.","what":"AI in your email sorts what arrives (needs you today, can wait, just information), drafts replies to routine messages in your style, and proposes meeting times from your calendar. You approve before anything is sent.","why":"Inbox and calendar admin is among the most-cited low-risk first projects for small businesses. In Xero's 60-day pilot of Gemini in Google Workspace with 250 staff, users saved 3.4 hours a week.","sources":[{"t":"Google Workspace: Xero customer story","u":"https://workspace.google.com/customers/xero/"},{"t":"Databrain: the best first AI automation project for an SME","u":"https://databrain.solutions/insights/the-best-first-ai-automation-project-for-an-sme"}],"steps":["Turn on the AI in your email (Gemini in Gmail or Copilot in Outlook).","Set up labels or folders for needs me, later and FYI.","Write down your reply style and a few standard answers.","Approve drafts for two weeks before trusting any rule.","Measure time in the inbox against your baseline."],"tools":["Gemini in Gmail","Copilot in Outlook","Fyxer or Superhuman","Reclaim or Motion"],"time":"1 day","cost":"Often included; add-ons about US$20–30 a month","risks":["Don't let it send on your behalf until you've approved its drafts for a while."],"after":["platform"],"emberseed":"A typical AI Quick Win, and a staple of the Team AI Workshop."},{"id":"ops-sops","name":"SOPs from a walkthrough","stage":"quick","branch":"ops","summary":"Talk or click through a process once, and AI writes the procedure in your template, with screenshots and an owner.","what":"Someone who knows the job records a walkthrough (a screen capture, or a talk-through on a call), and AI turns it into a step-by-step procedure in your template, with screenshots, warnings and a review date. It goes into your second brain with an owner.","why":"Know-how that lives in one person's head is a risk every small business carries. The AI Adopt Centre at ARM Hub found AI pays off for SMEs where it reduces reliance on key staff, and its safety assistant for an industry association is built on approved procedures.","sources":[{"t":"ARM Hub: AMCA impact study","u":"https://www.armhub.com.au/impact-studies/amca"}],"steps":["List the ten processes that would stop if one person left.","Record each one being done, talking through the why.","Have AI write the SOP in your template.","Ask someone else to follow it, and fix the gaps.","File it with an owner and a review date."],"tools":["Scribe or Tango","Loom","Teams or Meet recordings","Claude or ChatGPT"],"time":"1–2 hours per process","cost":"A$0–30 a month","risks":["An SOP nobody reviews goes out of date. Give each one a review date."],"after":["second-brain"],"emberseed":"Part of a Quick Win or a Sprint; the SOPs feed your second brain and your training."},{"id":"ops-intake","name":"Paperwork in, data out","stage":"connected","branch":"ops","summary":"Purchase orders, delivery dockets, forms and job sheets read straight into your systems, with unsure fields flagged.","what":"Documents arriving by email, upload or phone photo are read by AI, checked against rules (is the order number real, does the total add up) and entered into the right system. Fields the AI isn't sure of go to a person in a review queue.","why":"Re-keying is the classic back-office job where AI pays off. Cin7 reports order entry falling from 6.5 minutes to 45 seconds (a vendor figure), and MIT found the biggest returns from generative AI in back-office automation rather than the sales and marketing work most budgets go to.","sources":[{"t":"Cin7 Summit 2026","u":"https://www.cin7.com/blog/cin7-summit-2026/"},{"t":"Fortune: MIT report on generative AI pilots (Aug 2025)","u":"https://fortune.com/2025/08/18/mit-report-95-percent-generative-ai-pilots-at-companies-failing-cfo/"}],"steps":["Pick the document type you re-key most.","Collect 50 real examples, including messy ones.","Set up extraction with confidence thresholds and a review queue.","Check every entry for two weeks, then only the flagged ones.","Track minutes per document and the error rate."],"tools":["Cin7 document recognition","Power Automate AI Builder","Google Workspace Studio","Make or n8n with Claude"],"time":"1–3 weeks","cost":"A$30–150 a month","risks":["Confident errors are the danger. Keep the review queue, and spot-check approved entries."],"after":["connect","paperwork"],"emberseed":"A Sprint build."},{"id":"ops-flows","name":"Admin flows in plain English","stage":"connected","branch":"ops","summary":"Describe a routine (approvals, reminders, status updates) in a sentence, and your office suite builds the automation.","what":"Google Workspace Studio, Microsoft Copilot Studio, Zapier Agents and Claude's scheduled tasks now build automations from a plain-English description, such as 'when a job is marked complete, email the customer a survey and add a review reminder'. A person tests each one and owns it.","why":"Most small-business admin is a chain of small, repeatable steps across apps. Building the chain no longer needs a developer, which puts automation in the hands of the people who do the work.","sources":[{"t":"BizTech: Google Workspace Studio for small businesses (Aug 2026)","u":"https://biztechmagazine.com/article/2026/08/how-googles-workspace-studio-helps-small-businesses-work-smarter"}],"steps":["List ten routines your team repeats each week.","Describe one in plain English to your office suite's automation builder.","Test it on real cases with a person watching.","Name an owner, and write down what it does.","Add the next routine only when the first runs cleanly."],"tools":["Google Workspace Studio","Microsoft Copilot Studio","Zapier Agents","Claude scheduled tasks"],"time":"1–2 weeks","cost":"Often included; A$0–80 a month","risks":["Long chains fail quietly. Keep each automation short, logged and owned."],"after":["ops-inbox","connect"],"emberseed":"A Sprint build, plus a Workshop that teaches your team to build their own."},{"id":"ops-agent","name":"A back-office agent","stage":"deep","branch":"ops","summary":"An agent that runs admin across email, accounts, CRM and jobs, and queues every action for a person to approve.","what":"A Claude or Copilot agent connected to your email, accounting, CRM and job system works through admin that spans them: chasing missing paperwork, matching finished jobs to invoices, updating customers, preparing the week's schedule. It drafts and queues; people approve.","why":"This is the frontier for small businesses in late 2026: Anthropic's Claude for Small Business and similar products bundle the connectors and workflows. Gartner expects over 40% of agentic AI projects to be cancelled by the end of 2027, so start with one bounded process and earn trust.","sources":[{"t":"SiliconANGLE: Anthropic launches Claude for Small Business (May 2026)","u":"https://siliconangle.com/2026/05/13/anthropic-launches-claude-small-business-new-automation-workflows/"},{"t":"ASD: careful adoption of agentic AI services (May 2026)","u":"https://www.cyber.gov.au/publication/careful-adoption-of-agentic-ai-services"}],"steps":["Pick one cross-system admin process with a clear finish.","Connect each system read-only, then add write access behind approval.","Write the process as a skill file, with examples.","Run it daily with a person approving everything for a month.","Widen its permissions only where the log shows it's reliable."],"tools":["Claude Cowork with connectors","Claude for Small Business workflows","Microsoft Copilot Studio","ChatGPT workspace agents"],"time":"1–3 months","cost":"A$50–300 a month","risks":["Don't give one agent untrusted email, private data and the power to send. Split the jobs, or add approval."],"after":["ops-flows","agents","check-ai"],"emberseed":"A Fractional AI Lead build."},{"id":"risk-swms","name":"SWMS in minutes, not hours","stage":"quick","branch":"risk","summary":"Safe Work Method Statements and risk assessments drafted from your approved hazard library, checked by a competent person.","what":"A structured workflow asks about the task, the site and the conditions, then drafts the SWMS or job safety analysis from your approved hazard library and controls, not from the open internet. A competent person checks it against the actual site before work starts.","why":"This is the strongest published Australian SME result we found. A pilot built with the government-funded AI Adopt Centre at ARM Hub for the air-conditioning and mechanical contractors' association (AMCA) cut SWMS preparation from up to four hours to under 15 minutes.","sources":[{"t":"ARM Hub: AMCA impact study","u":"https://www.armhub.com.au/impact-studies/amca"},{"t":"ACCIONA: AI safety tool, WHS innovation finalist","u":"https://www.acciona.com.au/updates/news/acciona-ai-powered-safety-tool-named-finalist-in-national-whs-innovation-awards"}],"steps":["Gather your approved hazard library and some good past SWMS.","Build a structured template that asks the right questions.","Draft, then have a competent person check it against the site.","Update the library after incidents and near misses.","Track preparation time, and the issues audits find."],"tools":["SafetyCulture AI","Copilot, Gemini or Claude with your library","Australian SWMS template tools"],"time":"3–10 days","cost":"A$0–60 a month","risks":["Generic controls (just 'wear PPE') are a red flag. Your duty under WHS law doesn't change."],"after":["policy","helpers"],"emberseed":"An AI Quick Win for trades and contractors, built on your own hazard library."},{"id":"risk-contracts","name":"A first read of contracts","stage":"quick","branch":"risk","summary":"Leases, supplier terms and customer contracts summarised, with unusual clauses flagged before you sign or call a lawyer.","what":"Before signing, AI reads the contract against your checklist (term, renewal, notice, liability, indemnities, IP, termination) and gives you a plain-English summary with the clauses worth querying. Anything significant goes to your lawyer, now with a sharper question.","why":"Owners often sign leases and terms unread. AI first reads suit NDAs and low-value contracts well, but not complex clauses, and a Victorian solicitor was sanctioned for AI-invented citations. Treat it as a careful reader, never as legal advice.","sources":[{"t":"Sprintlaw: AI contract review, what works and what doesn't","u":"https://sprintlaw.com.au/articles/ai-contract-review-what-works-what-doesnt-and-using-it-safely/"},{"t":"Lawpath AI document review (hosted in Australia)","u":"https://lawpath.com.au/lawpath-ai-document-review"},{"t":"Lawyers Weekly: first Australian lawyer sanctioned for AI use","u":"https://www.lawyersweekly.com.au/biglaw/42917-first-ever-aussie-lawyer-sanctioned-for-ai-use"}],"steps":["Write a checklist of the clauses that matter to your business.","Use a business AI account or an Australian-hosted review tool.","Get a summary and the flagged clauses for each contract.","Send anything significant to your lawyer with the AI's flags.","Keep the signed contract in your register."],"tools":["Lawpath AI document review","Claude, ChatGPT or Copilot with your checklist"],"time":"1 day to set up","cost":"A$0–50 a month","risks":["This isn't legal advice. Indemnities, IP and unfair terms go to a lawyer."],"after":["platform"],"emberseed":"Part of a Workshop or a Quick Win. Legal advice stays with your lawyer."},{"id":"risk-renewals","name":"Never miss a renewal","stage":"connected","branch":"risk","summary":"Every contract, licence, insurance policy and registration in one register, with notice dates read out and reminders set.","what":"AI reads your contracts, policies and certificates, pulls out the parties, dates, renewal terms and notice periods, and builds one register with reminders well before each deadline: leases, software, insurance, licences, vehicle registrations, white cards.","why":"Missed notice periods lock businesses into auto-renewals, and lapsed insurance or licences carry real risk. Pulling dates out of documents is a dependable AI task with a simple human check.","sources":[{"t":"Lapasar: agentic AI in procurement, practical uses for 2026","u":"https://lapasar.com/blog/agentic-ai-in-procurement-practical-use-cases-teams-can-adopt-in-2026"}],"steps":["Gather every contract, policy and certificate in one folder.","Have AI extract the dates and terms into a register.","Check each row against its document once.","Set reminders for a month before each notice period.","Add new documents as they arrive, with an email rule."],"tools":["Claude or Copilot","SharePoint lists, Notion or monday.com","Docusign IAM or Juro"],"time":"1–2 weeks","cost":"A$0–50 a month","risks":["One misread date matters. Check every extraction against the source once."],"after":["risk-contracts","data-ready"],"emberseed":"A Sprint build."},{"id":"risk-safety-qa","name":"Safety answers on site","stage":"connected","branch":"risk","summary":"Workers ask safety questions on site and get answers only from your procedures and data sheets, with the source.","what":"A phone assistant answers questions such as 'what PPE for this chemical?' or 'what's the isolation procedure?' using only your safe work procedures and safety data sheets. It quotes the document, escalates to a supervisor when it isn't sure, and logs every exchange.","why":"Calling a supervisor or digging through manuals slows work and invites guesswork. The AMCA safety assistant built with ARM Hub follows exactly this pattern: approved documents only, traceable answers, escalation and logs.","sources":[{"t":"ARM Hub: AMCA impact study","u":"https://www.armhub.com.au/impact-studies/amca"}],"steps":["Collect current procedures and safety data sheets.","Build the assistant on those documents only, with citations required.","Set escalation rules for anything outside them.","Trial it with one crew, and review the log weekly.","Update the documents where the log shows gaps."],"tools":["Copilot Studio","Gemini Gems","Claude Projects","SafetyCulture"],"time":"2–4 weeks","cost":"A$0–100 a month","risks":["A wrong safety answer can hurt someone. Every answer cites its source, and anything unclear goes to a person."],"after":["risk-swms","brain-grows"],"emberseed":"A Sprint build."},{"id":"risk-compliance","name":"Compliance that keeps itself","stage":"deep","branch":"risk","summary":"Corrective actions chased, regulators' changes watched, and audit evidence gathered as you work.","what":"Agents chase overdue corrective actions, scan regulators' updates (Safe Work, the OAIC, the NHVR, your industry body) for changes that affect you, and collect evidence for certifications such as ISO 9001, ISO 27001 or the Essential Eight as work happens, so audits stop being a scramble.","why":"Customers increasingly ask suppliers for security and quality evidence before they'll sign. Compliance platforms automate much of the evidence gathering, and a scheduled agent that reads regulators' updates is cheap to run.","sources":[{"t":"CRN Australia: Drata launches in APAC (2025)","u":"https://www.crn.com.au/news/2025/security/ai-vendor-drata-launches-apac"},{"t":"Verdantix: SafetyCulture platform","u":"https://atlas.verdantix.com/safetyculture/safetyculture-platform-2"}],"steps":["List the obligations and certifications your customers care about.","Put corrective actions in one tracker, with owners and dates.","Have an agent chase overdue actions weekly.","Add a monthly scan of regulators' updates, with a summary of what changed.","Gather certification evidence in the tool as you go."],"tools":["Drata or Vanta","SafetyCulture agents","Scheduled Claude agents","ComplianceQuest"],"time":"1–3 months","cost":"A$50–600 a month","risks":["A summary of a regulation is not the regulation. Read the source before you act."],"after":["risk-renewals","agents","check-ai"],"emberseed":"A Fractional AI Lead build. Certification audits stay with accredited auditors."},{"id":"prod-research","name":"Market research in a day","stage":"quick","branch":"product","summary":"Competitor, market and regulation scans in hours instead of weeks, with every source cited for you to check.","what":"Deep-research modes in ChatGPT, Claude, Gemini and Perplexity read dozens of sources and write a cited report: what competitors charge, how a market is shifting, what a regulation requires. NotebookLM can combine them with your own documents. You check the citations that matter.","why":"Small businesses rarely have time for research, so decisions run on hunches. Research that took weeks now takes an afternoon, but invented citations remain a known failure, so every claim you rely on gets checked.","sources":[{"t":"Lawyers Weekly: first Australian lawyer sanctioned for AI use","u":"https://www.lawyersweekly.com.au/biglaw/42917-first-ever-aussie-lawyer-sanctioned-for-ai-use"}],"steps":["Write down the decision the research is for, and the questions.","Run deep research in two different tools, and compare them.","Open and check the sources behind any claim you'll act on.","Summarise the findings and the decision on one page.","File it in your second brain."],"tools":["ChatGPT deep research","Claude Research","Gemini Deep Research","Perplexity","NotebookLM"],"time":"Half a day per question","cost":"Included in business AI plans","risks":["Research tools can invent sources. Check before you quote."],"after":["platform"],"emberseed":"Part of a Workshop or a Quick Win. This map was researched the same way."},{"id":"prod-prototype","name":"Prototype in an afternoon","stage":"quick","branch":"product","summary":"Clickable prototypes of a new service, app or calculator, built from a description, to test with customers first.","what":"Describe the tool or service you're imagining (a quote calculator, a booking flow, a client portal) and AI builds a clickable prototype you can show customers the same day. Keep real data out: it's for learning, not for running the business.","why":"Testing an idea with customers before paying for a build is the cheapest risk reduction there is. Prototyping tools now produce working mock-ups from plain English in minutes.","sources":[],"steps":["Write the idea as a short story: who uses it, and for what.","Build a prototype in Claude artifacts, Lovable or v0.","Show it to five customers and watch them use it.","Note what they expected and what confused them.","Decide whether to build it, change it or drop it."],"tools":["Claude artifacts","Lovable","v0","Figma Make"],"time":"1–2 days","cost":"A$0–50 a month","risks":["A prototype isn't production. Keep customer data out of it."],"after":["platform"],"emberseed":"Part of a Workshop or a Quick Win. This map was built with Claude from a description, then refined."},{"id":"prod-feedback","name":"Turn feedback into specs","stage":"connected","branch":"product","summary":"Customer interviews, calls and feedback transcribed, tagged, and turned into specifications linked to the evidence.","what":"Interview recordings, sales calls and feedback are transcribed and tagged by theme, so you can ask what customers said about a feature and get quotes with links. Draft specifications are written from the evidence, so every requirement traces back to a real customer.","why":"Insights stuck in recordings and notes don't shape what you build. Specs linked to evidence settle arguments and stop you building for the loudest voice.","sources":[{"t":"Dovetail (Australian customer-insight platform)","u":"https://dovetail.com/"}],"steps":["Get consent, and record customer conversations.","Transcribe them and tag them by theme.","Ask questions across them, and pull out the evidence.","Draft specs that link each requirement to quotes.","Review the specs with the people who'll build or deliver them."],"tools":["Dovetail","Claude or ChatGPT Projects","Fathom or Otter"],"time":"2–3 weeks","cost":"A$0–100 a month","risks":["Recordings carry personal information. Get consent and store them securely."],"after":["care-themes","meetings"],"emberseed":"A Sprint build."},{"id":"prod-rnd","name":"R&D records kept for you","stage":"connected","branch":"product","summary":"A weekly AI summary of your experiments in the form the R&D Tax Incentive expects, plus first drafts of grants.","what":"Each week AI summarises what your team tried, learnt and changed (from code history, tickets, lab notes or meeting notes) into an experiment log: hypothesis, experiment, outcome. At claim time your adviser has records made at the time, and grant applications start from a draft rather than a blank page.","why":"The R&D Tax Incentive relies on records of hypotheses, experiments and outcomes kept as the work happens, and businesses without them leave money on the table. The records must be real: never generate them after the fact.","sources":[{"t":"business.gov.au: Research and Development Tax Incentive","u":"https://business.gov.au/grants-and-programs/research-and-development-tax-incentive"}],"steps":["Agree the experiment-log template with your R&D adviser.","Connect the sources: code history, tickets, lab or meeting notes.","Have AI draft the weekly log for a person to confirm.","Keep links to the evidence with each entry.","Have AI draft grant applications from the log, for your adviser to review."],"tools":["Claude or Copilot","GitHub or Jira","Your adviser's templates"],"time":"1–2 weeks to set up","cost":"A$0–50 a month","risks":["Never fabricate or backdate records. The log must reflect what really happened."],"after":["meetings","connect"],"emberseed":"A Sprint build, alongside your R&D adviser."},{"id":"prod-apps","name":"Your own small apps","stage":"connected","branch":"product","summary":"Quote calculators, checklists, portals and dashboards built with AI, then secured and backed up like real software.","what":"Small tools that fit your business exactly (a pricing calculator, a site checklist, a client portal, a dashboard) are built with AI coding tools in days, then hardened: sign-in, access rules, backups and a test before each change. They live in your accounts, and you own the code.","why":"Off-the-shelf software rarely fits a small business's odd jobs, and AI has made small custom tools cheap. But scans of AI-built apps keep finding security holes (one 2026 scan found flaws in 1,046 of 1,072), so the hardening step isn't optional.","sources":[{"t":"Symbiotic Security: we scanned 1,072 vibe-coded apps (2026)","u":"https://www.symbioticsec.ai/blog/we-scanned-1-072-vibe-coded-apps-98-had-security-flaws"},{"t":"Cloud Security Alliance: AI codegen vulnerability debt (2026)","u":"https://labs.cloudsecurityalliance.org/research/csa-research-note-ai-codegen-vulnerability-debt-2026"}],"steps":["Start from a tested prototype (see Prototype in an afternoon).","Build it in your own accounts, with sign-in from day one.","Add access rules, backups and a test for each change.","Have someone other than the builder try to break it.","Write the runbook and name an owner."],"tools":["Claude Code","Cursor or Codex","Lovable or Replit","Supabase or Google Sheets behind it"],"time":"1–4 weeks","cost":"A$0–75 a month","risks":["Exposed data, no backups and unofficial IT. Build it securely or don't deploy it."],"after":["prod-prototype","security","check-ai"],"emberseed":"A Sprint build. EmberSeed builds working apps this way, including an iPhone app delivered through TestFlight."},{"id":"prod-ai-inside","name":"AI inside your own product","stage":"deep","branch":"product","summary":"An assistant, calculator or document checker built into what you sell, grounded in your content and monitored.","what":"Add AI to the product or service you sell: an assistant that answers from your manuals, a tool that checks customers' documents, a calculator that explains its answer. It's grounded in your own content, hosted in Australia where possible, tested before release, monitored after, and always has a human fallback.","why":"Competitors are embedding assistants and document analysis. But MIT found internal AI builds succeed about a third as often as tools bought from specialist vendors, so build only where the AI is your product's real advantage.","sources":[{"t":"Fortune: MIT report on generative AI pilots (Aug 2025)","u":"https://fortune.com/2025/08/18/mit-report-95-percent-generative-ai-pilots-at-companies-failing-cfo/"}],"steps":["Prove customers want it with a prototype first.","Ground it in your content, with clear limits.","Host it in Australian regions where available.","Test it on real cases before launch, and monitor it after.","Give customers a way to reach a person."],"tools":["Claude, OpenAI or Gemini APIs","AWS Sydney or Azure Australia East","Langfuse or Promptfoo"],"time":"2–6 months","cost":"Usage-based, from tens to thousands of dollars a month","risks":["You're responsible for what it tells your customers. Test it, monitor it and disclose it."],"after":["prod-apps","check-ai","private-ai"],"emberseed":"A Fractional AI Lead project, scoped carefully. Complex builds go with a specialist development partner."},{"id":"stock-quotes","name":"Supplier quotes compared","stage":"quick","branch":"stock","summary":"Supplier quotes in, one like-for-like table out: units, inclusions, hidden charges, terms and questions to ask.","what":"Drop in supplier quotes (PDFs, emails, spreadsheets) and AI builds a like-for-like comparison: unit prices normalised, inclusions and exclusions, delivery and payment terms, hidden charges, and questions to put back to each supplier. You decide.","why":"Comparing quotes by hand is slow and easy to get wrong when every supplier uses a different format. Quote analysis is among the most practical purchasing uses of AI for businesses that don't run large tenders.","sources":[{"t":"Lapasar: agentic AI in procurement, practical uses for 2026","u":"https://lapasar.com/blog/agentic-ai-in-procurement-practical-use-cases-teams-can-adopt-in-2026"}],"steps":["Collect the quotes for one purchase.","Ask AI for a normalised comparison and a list of questions.","Check the key numbers against the originals.","Send the questions, and update the table.","Save the comparison with the decision."],"tools":["Claude, ChatGPT or Copilot in Excel"],"time":"An hour per purchase","cost":"Included in business AI plans","risks":["AI can misread units or totals. Check the key numbers against the quotes."],"after":["platform"],"emberseed":"Usually covered in a Team AI Workshop."},{"id":"stock-digest","name":"A daily stock digest","stage":"quick","branch":"stock","summary":"Low stock, slow movers and odd orders in a short morning digest, and stock questions answered in plain English.","what":"Each morning a digest lists what's running low, what isn't moving and anything unusual in yesterday's orders. Through the day, staff ask your inventory system's AI questions such as 'what did we sell of this last winter?' instead of building reports.","why":"Inventory answers are usually buried in reports nobody has time to run. Inventory platforms are adding plain-language assistants, and a daily digest is a simple scheduled job.","sources":[{"t":"Cin7 Summit 2026","u":"https://www.cin7.com/blog/cin7-summit-2026/"}],"steps":["Agree the three lists that matter: low, slow and odd.","Set up the digest from your inventory system.","Turn on its AI assistant for questions.","Act on the digest for a month, and tune the thresholds.","Track stockouts and dead stock against your baseline."],"tools":["Cin7 AI","Shopify Sidekick","Unleashed reports","n8n with Claude or Copilot"],"time":"2–5 days","cost":"A$0–60 a month","risks":["A digest is only as good as your stock counts. Fix the counts first."],"after":["data-ready"],"emberseed":"An AI Quick Win."},{"id":"stock-match","name":"Orders matched to bills","stage":"connected","branch":"stock","summary":"Purchase orders, deliveries and supplier bills matched automatically, with differences flagged before you pay.","what":"When a supplier's bill arrives, it's matched line by line against the purchase order and what was received. Matching bills flow on to approval; differences in price, quantity or items are flagged for a person, along with spending outside your approval rules.","why":"Paying for what wasn't ordered or delivered is a quiet, common leak. Matching orders, deliveries and bills used to need an ERP; approval and capture tools for Xero and MYOB now do it for small businesses.","sources":[{"t":"Xero App Store: Lightyear","u":"https://apps.xero.com/au/function/bills-expenses/app/lightyear"},{"t":"IT Brief: ApprovalMax AI bill checks for Xero (Oct 2026)","u":"https://itbrief.co.uk/story/approvalmax-launches-ai-bill-checks-for-xero-users"}],"steps":["Raise purchase orders for all regular buying.","Record deliveries against them.","Turn on matching in your approval or capture tool.","Review differences before paying.","Set approval thresholds by amount and category."],"tools":["ApprovalMax","Lightyear","Cin7 document recognition","Xero or MYOB"],"time":"1–2 weeks","cost":"About A$30–100 a month","risks":["Matching only works if orders and deliveries are recorded. Fix that habit first."],"after":["paperwork","fin-billcheck"],"emberseed":"A Sprint build, often alongside Stop fake and duplicate bills."},{"id":"stock-spend","name":"Catch supplier price creep","stage":"connected","branch":"stock","summary":"A year of bills analysed by supplier and category: price rises, duplicates, and where consolidating would save.","what":"AI analyses twelve months of bills from your accounting system by supplier, item and category, and reports price rises over time, suppliers you could consolidate, spending outside agreements, and duplicates. Re-run each quarter, it becomes your purchasing early warning.","why":"Price creep goes unnoticed one invoice at a time. The analysis is simple once bills are in your accounting system, and accounting connectors now let an AI read them directly.","sources":[{"t":"Xero: Claude integration (May 2026)","u":"https://www.xero.com/au/media-releases/xero-delivers-claude-integration-to-advance-ai-powered-financial-intelligence/"}],"steps":["Export or connect twelve months of bills.","Ask for the price-change, supplier and category analysis.","Check the top findings against the invoices.","Renegotiate or switch on the biggest three.","Schedule the analysis quarterly."],"tools":["Xero or MYOB connectors in Claude or Copilot","Excel or Google Sheets"],"time":"2–5 days","cost":"Included in business AI plans","risks":["Coding errors skew the picture. Spot-check the source bills."],"after":["paperwork","connect"],"emberseed":"A Quick Win or a Sprint build."},{"id":"stock-forecast","name":"Forecasts that draft orders","stage":"deep","branch":"stock","summary":"Demand forecasts that allow for seasons and promotions, turned into draft purchase orders for a buyer to approve.","what":"Forecasting software learns your sales patterns (seasons, promotions, trends), suggests reorder quantities and dates for each item, and drafts purchase orders for a buyer to approve. It improves as it sees more history.","why":"Real gains in stockouts and overstock are possible, but only with enough data. An independent review puts the threshold at 12 months of sales (24 for seasonal lines) and 50+ products each selling 20+ a month; below that, a well-kept spreadsheet often wins.","sources":[{"t":"Compare the Cloud: an honest review of AI demand forecasting","u":"https://www.comparethecloud.net/articles/ai-demand-forecasting-uk-indie-retailers-shopify-brightpearl-honest-review"},{"t":"Cin7 ForesightAI","u":"https://www.cin7.com/foresightai/"}],"steps":["Check you meet the data thresholds before buying anything.","Clean the item history: merges, discontinued lines, stockout periods.","Trial forecasting on your top 50 items.","Compare its suggestions with your buyer's for two months.","Let it draft orders for approval where it does better."],"tools":["Cin7 ForesightAI","Unleashed Advanced Inventory Manager","Prediko or Inventory Planner (Shopify)"],"time":"1–3 months","cost":"Add-ons from about A$100–500 a month","risks":["Too little history gives confident, wrong forecasts. Respect the thresholds."],"after":["stock-digest","data-ready","check-ai"],"emberseed":"A Fractional AI Lead project, starting with a check that your data is ready."},{"id":"field-voice","name":"Job notes by voice","stage":"quick","branch":"field","summary":"Technicians talk; AI writes the job notes, a summary for the customer and a draft invoice.","what":"At the end of each job the technician talks into their phone: what they found, what they did, parts used. AI turns it into tidy job notes, a customer-friendly summary and a draft invoice in your job-management system, for the office or the tech to check.","why":"Paperwork after every job eats evenings. ServiceM8, made in Adelaide, estimates 3.5+ hours a week saved at four invoices a day from its AI invoicing (a vendor figure), and Tradify added similar tools in 2026.","sources":[{"t":"ServiceM8: AI job management for trades","u":"https://www.servicem8.com/ai-job-management-software-for-trade-contractors"},{"t":"Sandlabs: built-in AI in Australian trades software","u":"https://sandlabs.com.au/blog/ai-for-australian-trades-software"}],"steps":["Turn on voice notes and AI invoicing in your job system.","Agree what a good job note contains.","Have the techs use it on every job for two weeks.","Check drafts before they reach customers.","Track admin time per job against your baseline."],"tools":["ServiceM8","Tradify SmartTools","simPRO or AroFlo (through their APIs)"],"time":"1–2 days","cost":"Included in many job-management plans","risks":["Wrong parts or hours on an invoice cost goodwill. Check drafts until they're reliably right."],"after":["platform"],"emberseed":"An AI Quick Win for trades and field-service businesses."},{"id":"field-fleetq","name":"Ask your fleet data","stage":"quick","branch":"field","summary":"Plain-English questions to your telematics: who's idling, which vehicles are under-used, where the fuel goes.","what":"Telematics platforms now include AI assistants. Ask which vehicles idled most last week, which are under-used, or where speeding clusters, and get a chart and an answer. A weekly summary turns the data you already pay for into a few decisions.","why":"Most small fleets pay for telematics and use a fraction of it. Geotab's AI assistant has been available to all its Australian customers since October 2025, and other vendors are following.","sources":[{"t":"Geotab: Ace available in Australia (Oct 2025)","u":"https://www.geotab.com/au/press-release/geotab-ace/"}],"steps":["Turn on your telematics vendor's AI assistant.","Ask the five questions you'd most like answered.","Set up a weekly summary of use, idling and safety.","Pick one action a week from it.","Track fuel and vehicle use against your baseline."],"tools":["Geotab Ace","Teletrac Navman","MTData","EROAD"],"time":"1 day","cost":"Often included in your telematics plan","risks":["Driver data is personal information. Tell drivers what's collected and why."],"after":["policy"],"emberseed":"An AI Quick Win, from a founder who knows fleets and telematics well."},{"id":"field-routes","name":"Routes that plan themselves","stage":"connected","branch":"field","summary":"Daily routes and job order optimised automatically, re-planned when jobs change, and linked to your job system.","what":"Route-optimisation software plans each day's runs from your jobs, time windows, vehicle capacity and traffic, sends routes to drivers' phones, and re-plans when a job is added or cancelled. Linked to your job system, it gives customers accurate arrival times.","why":"In Geotab's 2026 Australian survey, 60% of small firms using route optimisation did more jobs a day without new staff or vehicles, and 51% cited lower fuel costs (a vendor survey).","sources":[{"t":"Geotab: the ROI of AI route optimisation in Australia (2026)","u":"https://www.geotab.com/au/blog/roi-ai-route-optimisation-australia/"}],"steps":["Get job addresses, time windows and durations into one system.","Trial a route optimiser on one week of real jobs.","Compare kilometres and jobs per day with your baseline.","Connect it to your job system and drivers' phones.","Send customers arrival windows automatically."],"tools":["OptimoRoute","Routific","Circuit","ServiceM8 AI scheduling"],"time":"1–3 weeks","cost":"About A$30–60 per vehicle a month","risks":["Bad addresses and unrealistic job times defeat any optimiser. Fix the data first."],"after":["field-voice","connect"],"emberseed":"A Sprint build."},{"id":"field-dashcam","name":"AI dashcam coaching","stage":"connected","branch":"field","summary":"Cameras that detect fatigue, phone use and near misses, tied to a fair coaching routine agreed with drivers.","what":"AI dashcams detect fatigue, distraction, phone use and following too close, alert the driver at the time, and send clips for coaching. The value comes from the routine around them: agreed rules, regular coaching, recognition for good driving, and drivers consulted from the start.","why":"53% of Australian fleets already use in-cab video, and fatigue and distraction sit at the centre of WHS and heavy-vehicle Chain of Responsibility duties. Vendors report large drops in incidents where coaching is consistent.","sources":[{"t":"IT Brief: Geotab launches an AI dash cam for Australian fleets","u":"https://itbrief.com.au/story/geotab-launches-ai-dash-cam-for-fleets-in-australia"},{"t":"IT Brief: Teletrac Navman AI tool for driver fatigue","u":"https://itbrief.com.au/story/teletrac-navman-introduces-ai-tool-to-combat-driver-fatigue"}],"steps":["Consult drivers and agree the rules before installing.","Check surveillance and privacy notice requirements in your state.","Install on a pilot group, and tune the alerts.","Set a weekly coaching routine, with recognition as well as correction.","Track incidents and near misses against your baseline."],"tools":["Geotab GO Focus Pro","Teletrac Navman IQ Camera","MTData","Lytx","Ctrack"],"time":"2–6 weeks","cost":"About A$40–90 per vehicle a month","risks":["Cameras without consultation damage trust and may breach surveillance law. Facial recognition is biometric data, so handle it with great care."],"after":["field-fleetq","policy"],"emberseed":"Scoped in a Sprint: the coaching routine, consultation and reporting. The hardware comes from your telematics provider."},{"id":"field-dispatch","name":"A dispatch agent","stage":"deep","branch":"field","summary":"An agent that turns emails into jobs, drafts quotes, matches supplier invoices and keeps customers updated.","what":"Working through your job system's API, an agent reads incoming job requests, creates jobs with the right details, drafts quotes from your price book, matches supplier invoices to jobs, and texts customers with updates. The dispatcher approves and handles the exceptions.","why":"Dispatchers spend much of the day moving information between email, the job system and invoices. Agents that use the job system's own API (never screen-scraping) can take that load, with approval for anything a customer sees.","sources":[{"t":"Sandlabs: ServiceM8 API agents (vendor)","u":"https://sandlabs.com.au/blog/servicem8-api-ai-agent-automation"}],"steps":["Map the dispatcher's day, and pick the most repetitive step.","Connect the agent to your job system's API.","Have it draft jobs and quotes for approval.","Add customer updates once the drafts are reliable.","Review the agent's log weekly with the dispatcher."],"tools":["ServiceM8, simPRO or AroFlo APIs","Claude agents","n8n"],"time":"1–3 months","cost":"A$50–200 a month","risks":["A wrong job or quote reaches a customer fast. Keep approvals until the log proves it's right."],"after":["field-routes","agents","check-ai"],"emberseed":"A Fractional AI Lead build."},{"id":"field-maintenance","name":"Fix vehicles before they fail","stage":"deep","branch":"field","summary":"Fault codes, kilometres and service history combined to book maintenance before breakdowns.","what":"Vehicle fault codes and engine data from your telematics, combined with service history, predict which vehicles need attention, so they're booked in before they break down.","why":"Vendors themselves put the payback point at about 25 or more vehicles, with clean digital maintenance records first. For smaller fleets, servicing driven by real kilometres and engine hours from telematics is the better first step.","sources":[{"t":"Oxmaint: when predictive maintenance pays for fleets","u":"https://oxmaint.com/industries/fleet-management/fleet-pdm-vs-pm-predictive-pays"}],"steps":["Get service history into a digital system.","Turn on fault-code alerts from your telematics.","Schedule services by real kilometres and hours, not the calendar.","With 25 or more vehicles and clean records, trial predictive alerts.","Track breakdowns and downtime against your baseline."],"tools":["Your telematics platform","Fleetio or similar maintenance software"],"time":"1–3 months","cost":"Varies with fleet size","risks":["Below about 25 vehicles, predictive models rarely pay. Start with scheduled servicing."],"after":["field-fleetq","data-ready"],"emberseed":"A Fractional AI Lead project for larger fleets."}]}</script>
